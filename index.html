<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B3439">
<title>Filemón · Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --yeso:#E8E8E3; --yeso-alto:#F4F4F0; --pizarra:#2B3439; --pizarra-2:#3C484E;
    --grafito:#1A1F22; --tiza:#8C948F; --linea:#CFCFC7;
    --listo:#146B52; --encargo:#A2620A; --alerta:#97302C; --tinta:#1F5F6B;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --texto:'Public Sans',system-ui,sans-serif;
    --dato:'IBM Plex Mono',ui-monospace,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--texto); color:var(--grafito); background:var(--yeso);
    background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1px);
    background-size:4px 4px; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:16px}
  :focus-visible{outline:2.5px solid var(--tinta);outline-offset:2px}

  .top{background:var(--pizarra);color:var(--yeso-alto);padding:16px 18px 14px;
       position:sticky;top:0;z-index:40;box-shadow:0 6px 18px rgba(43,52,57,.16)}
  .marca{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
  .marca h1{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin:0;color:#fff}
  .sync{display:flex;align-items:center;gap:7px;background:none;border:none;
        font-family:var(--dato);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
        color:rgba(232,232,227,.75);padding:6px 4px}
  .punto{width:8px;height:8px;border-radius:50%;background:var(--tiza);flex:0 0 8px}
  .punto.ok{background:#4FCF9C} .punto.mal{background:#E07A6E} .punto.trab{background:#E0B96E}
  @media (prefers-reduced-motion:no-preference){ .punto.trab{animation:late 1s ease-in-out infinite} }
  @keyframes late{50%{opacity:.35}}

  .buscar{position:relative}
  .buscar input{width:100%;padding:15px 44px 15px 16px;border:none;border-radius:3px;
                background:var(--yeso-alto);color:var(--grafito);font-size:17px;font-weight:500}
  .buscar input::placeholder{color:#9A9A93;font-weight:400}
  .limpiar{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;
           background:transparent;color:var(--tiza);font-size:22px;line-height:1;padding:8px 10px}

  .chips{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-family:var(--dato);font-size:11px;letter-spacing:.06em;padding:7px 11px;
        border-radius:2px;border:1px solid rgba(232,232,227,.28);background:transparent;
        color:rgba(232,232,227,.82);text-transform:uppercase}
  .chip[aria-pressed="true"]{background:var(--yeso-alto);color:var(--pizarra);border-color:var(--yeso-alto);font-weight:600}

  .respuesta{margin:14px 14px 0;background:#fff;border:1px solid var(--linea);
             border-left:5px solid var(--tinta);border-radius:3px;padding:15px 16px}
  .eyebrow{font-family:var(--dato);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
           color:var(--tiza);display:block;margin-bottom:9px}
  .respuesta p{margin:0 0 13px;font-size:15px;line-height:1.55;white-space:pre-wrap}
  .copiar{width:100%;padding:12px;border:none;border-radius:3px;background:var(--pizarra);color:#fff;
          font-family:var(--dato);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .copiar.ok{background:var(--listo)}

  .sello{display:inline-block;font-family:var(--dato);font-weight:600;font-size:10.5px;
         letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;
         border:1.5px solid currentColor;border-radius:2px}
  .sello.listo{color:var(--listo)} .sello.encargo{color:var(--encargo)} .sello.no{color:var(--alerta)}

  .cuerpo{padding:14px}
  .conteo{font-family:var(--dato);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
          color:var(--tiza);margin:4px 2px 11px}
  .ficha{display:flex;gap:13px;background:#fff;border:1px solid var(--linea);border-radius:3px;
         padding:11px;margin-bottom:9px;width:100%;text-align:left;position:relative}
  .ficha:active{background:#FAFAF7}
  .ficha.pend::after{content:'';position:absolute;top:7px;right:7px;width:7px;height:7px;
                     border-radius:50%;background:#E0B96E}
  .foto{width:66px;height:66px;flex:0 0 66px;border-radius:2px;background:#EDEDE7 center/cover no-repeat;
        display:flex;align-items:center;justify-content:center;font-family:var(--dato);
        font-size:9px;color:#B4B4AC;letter-spacing:.06em}
  .info{flex:1;min-width:0}
  .cod{font-family:var(--dato);font-size:10.5px;color:var(--tiza);letter-spacing:.08em}
  .nom{font-family:var(--display);font-weight:600;font-size:16.5px;letter-spacing:-.01em;
       margin:2px 0 6px;line-height:1.2;overflow-wrap:anywhere}
  .pie{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .precio{font-family:var(--dato);font-size:12px;color:var(--pizarra-2)}
  .cant{flex:0 0 auto;align-self:center;text-align:center;padding-left:6px;
        border-left:1px solid var(--linea);min-width:58px}
  .cant b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
  .cant span{display:block;font-family:var(--dato);font-size:9px;color:var(--tiza);
             letter-spacing:.08em;margin-top:3px}

  .vacio{text-align:center;padding:48px 26px}
  .vacio h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0 0 8px}
  .vacio p{color:var(--pizarra-2);font-size:14.5px;line-height:1.6;margin:0 0 20px}

  .btn{border:none;border-radius:3px;padding:13px 18px;font-family:var(--dato);
       font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .btn-primario{background:var(--pizarra);color:#fff}
  .btn-borde{background:transparent;color:var(--pizarra);border:1.5px solid var(--pizarra)}
  .btn-peligro{background:transparent;color:var(--alerta);border:1.5px solid var(--alerta)}
  .btn-verde{background:var(--listo);color:#fff}
  .btn[disabled]{opacity:.5;pointer-events:none}

  .flotante{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:45;display:flex;gap:9px}
  .flotante .btn{box-shadow:0 5px 16px rgba(43,52,57,.3);padding:14px 20px}
  .btn-mas{background:var(--tinta);color:#fff}

  .capa{position:fixed;inset:0;background:rgba(26,31,34,.55);z-index:60;
        display:flex;align-items:flex-end;justify-content:center}
  .hoja{background:var(--yeso-alto);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;
        border-radius:10px 10px 0 0;padding:20px 18px 30px}
  .hoja-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
  .hoja-top h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em}
  .cerrar{border:none;background:transparent;font-size:27px;line-height:1;color:var(--tiza);padding:0 4px}

  .campo{margin-bottom:14px}
  .campo label{display:block;font-family:var(--dato);font-size:10px;letter-spacing:.12em;
               text-transform:uppercase;color:var(--pizarra-2);margin-bottom:5px}
  .campo input,.campo textarea,.campo select{width:100%;padding:11px 12px;border:1px solid var(--linea);
                                             border-radius:3px;background:#fff;color:var(--grafito)}
  .campo textarea{resize:vertical;min-height:62px;line-height:1.5}
  .pista{display:block;margin-top:5px;font-size:12px;color:var(--tiza);line-height:1.45;
         font-family:var(--texto);letter-spacing:0;text-transform:none}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:11px}

  .contador{display:flex;align-items:center;gap:12px}
  .contador button{width:46px;height:46px;border:1.5px solid var(--pizarra);background:#fff;
                   border-radius:3px;font-size:22px;line-height:1;color:var(--pizarra)}
  .contador input{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:24px}

  .foto-caja{display:flex;gap:13px;align-items:center;margin-bottom:16px;padding:13px;
             background:#fff;border:1px solid var(--linea);border-radius:3px}
  .foto-prev{width:76px;height:76px;flex:0 0 76px;border-radius:2px;background:#EDEDE7 center/cover no-repeat;
             display:flex;align-items:center;justify-content:center;font-family:var(--dato);
             font-size:9px;color:#B4B4AC}

  .aviso{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--encargo);
         padding:12px 13px;border-radius:3px;font-size:13.5px;line-height:1.55;margin-bottom:14px}
  .acciones{display:flex;gap:9px;margin-top:20px}
  .acciones .btn{flex:1}

  .tarjetas{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:18px}
  .tarjeta{background:#fff;border:1px solid var(--linea);border-radius:3px;padding:13px}
  .tarjeta b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;display:block}
  .tarjeta span{font-family:var(--dato);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
                color:var(--tiza);margin-top:5px;display:block}

  #impresion{ display:none; }
  @media print{
    .top, .flotante, .capa, .brindis, #panel, .cuerpo{ display:none !important; }
    #app{ padding:0; max-width:none; background:#fff; }
    #impresion{ display:block; padding:0; color:#000; font-size:11pt; }
    #impresion h1{ font-family:var(--display); font-size:20pt; margin:0 0 2pt; }
    #impresion h2{ font-family:var(--display); font-size:12pt; margin:16pt 0 5pt;
                   border-bottom:1pt solid #999; padding-bottom:3pt; }
    #impresion table{ width:100%; border-collapse:collapse; font-size:9.5pt; }
    #impresion th{ text-align:left; border-bottom:1pt solid #333; padding:4pt 3pt; font-size:8pt;
                   text-transform:uppercase; letter-spacing:.05em; }
    #impresion td{ border-bottom:0.5pt solid #ccc; padding:4pt 3pt; }
    #impresion .num{ text-align:right; font-variant-numeric:tabular-nums; }
    #impresion .pie{ margin-top:14pt; font-size:8pt; color:#555; }
    @page{ margin:14mm; }
  }

  .barra{ display:flex; align-items:center; gap:9px; margin-bottom:6px; font-size:13px }
  .barra span:first-child{ flex:0 0 62px; font-family:var(--dato); font-size:11px; color:var(--pizarra-2) }
  .barra i{ display:block; height:16px; background:var(--tinta); border-radius:1px; min-width:2px }
  .barra .val{ flex:0 0 auto; font-family:var(--dato); font-size:11px; color:var(--tiza) }
  .barra.pico i{ background:var(--encargo) }

  .brindis{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--pizarra);
           color:#fff;padding:11px 18px;border-radius:3px;font-size:13.5px;z-index:80;
           box-shadow:0 5px 16px rgba(0,0,0,.25);max-width:88%;text-align:center}
  @media (prefers-reduced-motion:no-preference){
    .brindis{animation:sube .22s ease-out}
    @keyframes sube{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="marca">
      <h1>Filemón</h1>
      <button class="sync" id="btnSync"><span class="punto" id="punto"></span><span id="txtSync">Sin conectar</span></button>
    </div>
    <div class="buscar">
      <input id="q" type="search" placeholder="¿Tienes osos?  Escriba aquí…" autocomplete="off">
      <button class="limpiar" id="limpiar" aria-label="Limpiar" style="display:none">×</button>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-f="todas" aria-pressed="true">Todas</button>
      <button class="chip" data-f="listo" aria-pressed="false">Listas hoy</button>
      <button class="chip" data-f="encargo" aria-pressed="false">Por encargo</button>
      <button class="chip" data-f="no" aria-pressed="false">Sin molde</button>
      <button class="chip" data-f="bajo" aria-pressed="false">Se está acabando</button>
    </div>
  </div>

  <div id="panel"></div>
  <div class="cuerpo">
    <div class="conteo" id="conteo"></div>
    <div id="lista"></div>
  </div>

  <div id="impresion"></div>

  <div class="flotante">
    <button class="btn btn-mas" id="nueva">+ Figura</button>
    <button class="btn btn-primario" id="menu">···</button>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const app = $('#app');

let figuras = [], ventas = [], cola = [], config = {url:'', clave:''};
let filtro = 'todas', consulta = '', sincronizando = false, drenando = false, listo = false;

/* ══════════ almacenamiento local (caché) ══════════ */
const cache = {
  async get(k){
    try { if (window.storage){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; } } catch(e){}
    try { const v = localStorage.getItem('filemon:'+k); return v ? JSON.parse(v) : null; } catch(e){ return null; }
  },
  async set(k,v){
    try { if (window.storage){ await window.storage.set(k, JSON.stringify(v)); return; } } catch(e){}
    try { localStorage.setItem('filemon:'+k, JSON.stringify(v)); } catch(e){}
  }
};

/* ══════════ utilidades ══════════ */
const limpio = t => (t||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc = t => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const umbral = f => (f.minimo === 0 || f.minimo === '0' || Number(f.minimo)) ? Number(f.minimo) : 3;
const pesos  = n => '$' + (Number(n)||0).toLocaleString('es-CO',{maximumFractionDigits:0});

function estado(f){
  if (f.molde === 'danado' || f.molde === 'sinmolde') return 'no';
  return (Number(f.existencia)||0) > 0 ? 'listo' : 'encargo';
}
function etiqueta(f){
  const e = estado(f);
  if (e === 'listo') return 'Listas hoy';
  if (e === 'encargo') return 'Por encargo';
  return f.molde === 'danado' ? 'Molde dañado' : 'No la manejo';
}
function brindis(msg){
  document.querySelectorAll('.brindis').forEach(b=>b.remove());
  const d = document.createElement('div');
  d.className = 'brindis'; d.textContent = msg;
  app.appendChild(d); setTimeout(()=>d.remove(), 2800);
}

/* ══════════ puente con Google Sheets ══════════ */
async function api(accion, datos){
  if (!config.url) throw new Error('Falta conectar la hoja');
  const r = await fetch(config.url, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({token:config.clave, accion:accion, datos:datos||{}})
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Error del servidor');
  return j.datos;
}

function marcaSync(clase, texto){
  $('#punto').className = 'punto ' + clase;
  $('#txtSync').textContent = texto;
}

/* Toda modificación entra a una cola y se envía en orden. Si no hay señal,
   la cola espera en el celular; nada se pierde ni se revierte al sincronizar. */
function idsEnCola(){
  const s = new Set();
  cola.forEach(op=>{ const id = op.datos && op.datos.id; if (id) s.add(String(id)); });
  return s;
}

async function guardarCola(){ try { await cache.set('cola', cola); } catch(e){} }

async function encolar(tipo, datos){
  cola.push({tipo:tipo, datos:datos});
  await guardarCola();
  pintar();
  return drenar(true);
}

async function drenar(silencioso){
  if (!config.url || !cola.length || drenando) return !cola.length;
  drenando = true;
  marcaSync('trab','Enviando');
  try{
    while (cola.length){
      await api(cola[0].tipo, cola[0].datos);
      cola.shift();
      await guardarCola();
    }
    marcaSync('ok','Al día');
    pintar();
    return true;
  } catch(err){
    marcaSync('mal', `Sin enviar (${cola.length})`);
    if (!silencioso) brindis('No se pudo enviar: ' + err.message);
    pintar();
    return false;
  } finally { drenando = false; }
}

async function sincronizar(silencioso){
  if (sincronizando || !config.url) return;
  sincronizando = true;
  try{
    const pendientes = cola.length;
    const enviado = await drenar(silencioso);
    if (!enviado) return;
    marcaSync('trab','Sincronizando');
    const d = await api('leer');
    figuras = d.figuras || [];
    ventas  = d.ventas  || [];
    await cache.set('figuras', figuras);
    await cache.set('ventas', ventas);
    marcaSync('ok','Al día');
    if (!silencioso) brindis(pendientes ? `${pendientes} cambio(s) enviados a la hoja.` : 'Inventario al día.');
    pintar();
  } catch(err){
    marcaSync('mal','Sin conexión');
    if (!silencioso) brindis('No se pudo conectar: ' + err.message);
  } finally {
    sincronizando = false;
  }
}

/* ══════════ arranque ══════════ */
async function iniciar(){
  config  = (await cache.get('config'))  || {url:'', clave:''};
  figuras = (await cache.get('figuras')) || [];
  ventas  = (await cache.get('ventas'))  || [];
  cola    = (await cache.get('cola'))    || [];
  listo = true;
  marcaSync('', config.url ? 'Tocar para sincronizar' : 'Sin conectar');
  pintar();
  if (config.url) sincronizar(true);
}

/* ══════════ respuesta para el cliente ══════════ */
function redactar(f){
  const e = estado(f);
  const med = f.medidas ? ` Mide ${f.medidas}.` : '';
  const pre = Number(f.precio) > 0 ? ` Valor: ${pesos(f.precio)} c/u.` : '';
  if (e === 'listo'){
    const n = Number(f.existencia)||0;
    return `¡Hola! Sí 🙌 Tengo ${f.nombre} disponible: ${n} ${n===1?'unidad lista':'unidades listas'} para entrega inmediata.${pre}${med} ¿Cuántas necesitas?`;
  }
  if (e === 'encargo'){
    const d = Number(f.dias)||0;
    const plazo = d>0 ? `te las elaboro en ${d} ${d===1?'día':'días'}.` : 'te las elaboro sobre pedido.';
    return `¡Hola! Sí manejo ${f.nombre}. En este momento no tengo unidades listas, pero ${plazo}${pre}${med} ¿Cuántas necesitas y para qué fecha?`;
  }
  return `Por ahora no tengo disponible ${f.nombre}. Con gusto te muestro otras figuras que sí manejo y te pueden servir 🙂`;
}

async function copiar(texto, boton){
  let ok = false;
  try { await navigator.clipboard.writeText(texto); ok = true; } catch(e){}
  if (!ok){
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    app.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove();
  }
  if (ok && boton){
    const antes = boton.textContent;
    boton.textContent = '✓ Copiado'; boton.classList.add('ok');
    setTimeout(()=>{ boton.textContent = antes; boton.classList.remove('ok'); }, 1900);
  } else if (!ok) brindis('Seleccione el texto y cópielo manualmente.');
}

/* ══════════ ventas ══════════ */
function vendidasDesde(id, dias){
  const corte = Date.now() - dias*86400000;
  return ventas.filter(v => String(v.id)===String(id) && new Date(v.fecha).getTime() >= corte)
               .reduce((s,v)=>s+(Number(v.cantidad)||0),0);
}

/* ══════════ filtros ══════════ */
function coincide(f,q){
  if (!q) return true;
  const bolsa = limpio([f.codigo,f.nombre,f.categoria,f.claves,f.notas].join(' '));
  const partes = q.split(/\s+/).filter(p=>p && !VACIAS.has(p) && p !== 'algo' && p !== 'tienes' && p !== 'tiene');
  return (partes.length ? partes : q.split(/\s+/).filter(Boolean)).every(p=>bolsa.includes(p));
}
function visibles(){
  const q = limpio(consulta).trim();
  return figuras.filter(f=>{
    if (!coincide(f,q)) return false;
    if (filtro === 'todas') return true;
    if (filtro === 'bajo') return estado(f)==='listo' && Number(f.existencia) <= umbral(f);
    return estado(f) === filtro;
  }).sort((a,b)=>{
    const o = {listo:0, encargo:1, no:2};
    return (o[estado(a)]-o[estado(b)]) || (a.nombre||'').localeCompare(b.nombre||'','es');
  });
}

async function persistir(figura, extra){
  const i = figuras.findIndex(x=>x.id===figura.id);
  if (i>=0) figuras[i] = figura; else figuras.push(figura);
  await cache.set('figuras', figuras);
  pintar();

  /* La foto viaja dentro de la operación encolada: si no hay señal en el
     momento, sube igual cuando vuelva la conexión. */
  const enviado = await encolar('guardar', Object.assign({}, figura, extra||{}));
  if (enviado && extra && extra.fotoBase64) await sincronizar(true);
  else if (!enviado && config.url) brindis('Guardado en el celular. Se enviará a la hoja al reconectar.');
  return enviado;
}

/* ══════════ leer los nombres de archivo ══════════
   Las fotos vienen nombradas como "ABEJA MIEL FLOR NIÑA.jpg".
   De ahí salen el nombre, las palabras de búsqueda y el público. */

const CATEGORIAS_CLAVE = [
  ['Animales', ['abeja','ardilla','conejo','gato','leon','leona','dinosaurio','girafa','jirafa','flamingo','tucan',
                'pelicano','oso','mariposa','pollito','perro','vaca','elefante','buho','pez','tortuga','caballo',
                'oveja','pato','rana','koala','panda','zorro','ciervo','erizo','cerdo','raton','unicornio','dragon','sirena']],
  ['Flores y hojas', ['flor','girasol','rosa','hoja','margarita','tulipan','hongo','planta','cactus']],
  ['Transporte', ['carro','moto','bus','helicoptero','avion','tren','barco','camion','bicicleta','tractor']],
  ['Espacio y cielo', ['astronauta','estrella','luna','cohete','planeta','nube','sol','arcoiris']],
  ['Comida', ['dona','miel','fruta','helado','torta','cupcake','pastel','galleta','pizza','taza','cafe']],
  ['Corazones y amor', ['corazon','amor','beso','labio']],
  ['Casas', ['casita','casa','castillo','iglesia']],
  ['Letras y números', ['letra','numero','abecedario','inicial']],
  ['Bebé', ['bebe','biberon','chupo','sonajero','patuco']],
  ['Fechas especiales', ['navidad','halloween','calabaza','arbol','pascua','huevo']],
];

const VACIAS = new Set(['y','o','de','del','la','el','los','las','un','una','con','en','para','al','a','e']);

function variantes(p){
  const v = new Set([p]);
  if (p.length > 4 && p.endsWith('es')) v.add(p.slice(0,-2));
  else if (p.length > 3 && p.endsWith('s')) v.add(p.slice(0,-1));
  else v.add(p + (/[aeiou]$/.test(p) ? 's' : 'es'));   // flor→flores, casa→casas

  /* La gente pide en diminutivo: "osito", "conejito", "casita". */
  v.forEach(b=>{
    const m = b.match(/^(.+)(it[ao])s?$/);
    if (m && m[1].length > 2) v.add(m[1] + (m[2] === 'ita' ? 'a' : 'o'));
    else if (/[ao]$/.test(b) && b.length > 3){
      const r = b.slice(0,-1);
      v.add((r.endsWith('i') ? r.slice(0,-1) : r) + (b.endsWith('a') ? 'ita' : 'ito'));
    }
  });
  return v;
}

function adivinarCategoria(palabras){
  let mejor = 'Sin clasificar', max = 0;
  CATEGORIAS_CLAVE.forEach(([cat, claves])=>{
    const n = palabras.filter(p=>claves.some(c=>p===c || p===c+'s' || p===c+'es')).length;
    if (n > max){ max = n; mejor = cat; }
  });
  return mejor;
}

function analizarNombre(nombreArchivo){
  const base = nombreArchivo.replace(/\.[^.]+$/,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim();
  const publico = new Set(), resto = [];

  base.split(/[\/,]|\s+/).filter(Boolean).forEach(t=>{
    const n = limpio(t).replace(/[^a-z0-9]/g,'');
    if (!n) return;
    if (/^nin[ao]s?$/.test(n)) publico.add(n[3] === 'a' ? 'niña' : 'niño');
    else resto.push({crudo:t, norm:n});
  });

  const claves = new Set();
  resto.forEach(x=>{ if (!VACIAS.has(x.norm)) variantes(x.norm).forEach(v=>claves.add(v)); });
  publico.forEach(p=>{ claves.add(p); claves.add(limpio(p)); });

  return {
    nombre: resto.map(x=>x.crudo.charAt(0).toUpperCase() + x.crudo.slice(1).toLowerCase()).join(' ') || base,
    categoria: adivinarCategoria(resto.map(x=>x.norm)),
    claves: [...claves].join(', '),
    publico: [...publico].join(' y '),
  };
}

function codigoDe(nombre, usados){
  const raiz = (limpio(nombre).replace(/[^a-z0-9]/g,'').slice(0,3).toUpperCase()) || 'FIG';
  let i = 1, c;
  do { c = raiz + '-' + String(i).padStart(2,'0'); i++; } while (usados.has(c));
  usados.add(c);
  return c;
}

function comprimir(archivo, max, calidad){
  return new Promise((res, rej)=>{
    const lector = new FileReader();
    lector.onerror = rej;
    lector.onload = ()=>{
      const img = new Image();
      img.onerror = rej;
      img.onload = ()=>{
        const esc = Math.min(1, max/Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*esc); cv.height = Math.round(img.height*esc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', calidad));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

function abrirImportador(){
  const conFotos = !!config.url;
  const capa = abrir(`
    <div class="hoja-top"><h2>Importar desde las fotos</h2><button class="cerrar">×</button></div>
    <div class="aviso">
      Se leen los nombres de sus archivos. <b>ABEJA MIEL FLOR NIÑA.jpg</b> se convierte en una
      figura con esas cuatro palabras de búsqueda ya cargadas.
      ${conFotos ? '' : '<br><br>Como todavía no ha conectado su hoja, se importan los nombres <b>sin las fotos</b>. Las fotos las sube después y no pierde este trabajo.'}
    </div>
    <button class="btn btn-borde" id="elegir" style="width:100%">Elegir las fotos</button>
    <input type="file" id="archivos" accept="image/*" multiple style="display:none">
    <div id="previa"></div>`);

  const h = capa.querySelector('.hoja');
  h.querySelector('#elegir').addEventListener('click', ()=>h.querySelector('#archivos').click());

  h.querySelector('#archivos').addEventListener('change', ev=>{
    const archivos = [...(ev.target.files||[])];
    if (!archivos.length) return;

    const usados = new Set(figuras.map(f=>f.codigo).filter(Boolean));
    const yaHay = new Set(figuras.map(f=>limpio(f.nombre).replace(/\s+/g,' ').trim()).filter(Boolean));
    const previa = archivos.map(a=>{
      const d = analizarNombre(a.name);
      const repetida = yaHay.has(limpio(d.nombre).replace(/\s+/g,' ').trim());
      return Object.assign({archivo:a, codigo:codigoDe(d.nombre, usados), incluir:!repetida, repetida:repetida}, d);
    });
    const nuevas = previa.filter(p=>!p.repetida).length;
    const repes  = previa.length - nuevas;

    const cont = h.querySelector('#previa');
    cont.innerHTML = `
      <div class="campo" style="margin-top:16px">
        <label>${previa.length} fotos leídas · ${nuevas} nuevas${repes?` · ${repes} ya registradas`:''}</label>
        ${repes?`<span class="pista" style="margin:0 0 7px">Las que ya tiene aparecen desmarcadas para no duplicarlas. Nada de lo que ya registró se modifica.</span>`:''}
        <div id="filas" style="max-height:46vh;overflow-y:auto;border:1px solid var(--linea);border-radius:3px;background:#fff"></div>
      </div>
      <div id="avance" class="pista" style="margin-bottom:10px"></div>
      <div class="acciones" style="margin-top:0">
        <button class="btn btn-primario" id="importar">Importar ${nuevas}</button>
      </div>`;

    const filas = cont.querySelector('#filas');
    const boton = cont.querySelector('#importar');
    const recontar = ()=>{
      const n = previa.filter(p=>p.incluir).length;
      boton.textContent = 'Importar ' + n;
      boton.disabled = !n;
    };

    previa.forEach((p, i)=>{
      const fila = document.createElement('label');
      fila.style.cssText = 'display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-bottom:1px solid var(--linea);font-size:13.5px;line-height:1.45'
        + (p.repetida ? ';opacity:.55' : '');
      fila.innerHTML = `
        <input type="checkbox" ${p.incluir?'checked':''} data-i="${i}" style="width:auto;margin-top:3px;flex:0 0 auto">
        <span style="flex:1;min-width:0">
          <b></b>
          <span style="display:block;color:var(--tiza);font-size:12px;margin-top:2px"></span>
        </span>
        <span class="cod" style="flex:0 0 auto">${esc(p.codigo)}</span>`;
      fila.querySelector('b').textContent = p.nombre;
      fila.querySelector('span span').textContent =
        (p.repetida ? 'Ya registrada · ' : '') + p.categoria + (p.publico ? ' · ' + p.publico : '');
      fila.querySelector('input').addEventListener('change', e=>{ p.incluir = e.target.checked; recontar(); });
      filas.appendChild(fila);
    });
    recontar();

    boton.addEventListener('click', async ()=>{
      const sel = previa.filter(p=>p.incluir);
      if (!sel.length){ brindis('No marcó ninguna.'); return; }
      boton.disabled = true;
      const avance = cont.querySelector('#avance');

      let n = 0, fallos = 0;
      for (const p of sel){
        avance.textContent = `Importando ${n+1} de ${sel.length}…`;
        const fig = Object.assign(figuraNueva(), {
          codigo: p.codigo, nombre: p.nombre, categoria: p.categoria, claves: p.claves,
          notas: p.publico ? 'Para ' + p.publico : '',
        });
        let extra = null;
        if (conFotos){
          try { extra = {fotoBase64: await comprimir(p.archivo, 700, 0.72)}; } catch(e){}
        }
        figuras.push(fig);
        const enviado = await encolar('guardar', Object.assign({}, fig, extra||{}));
        if (!enviado && conFotos){ fallos++; }
        n++;
      }
      await cache.set('figuras', figuras);
      cerrar(); pintar();
      if (config.url) await sincronizar(true);
      brindis(fallos
        ? `${n} importadas, ${fallos} sin subir. Toque el punto de arriba para reintentar.`
        : `${n} figuras importadas.`);
    });
  });
}

      <b>${esc(f.nombre)}</b> · quedan ${Number(f.existencia)||0} en bodega</div>
    <div class="campo"><label>Cantidad vendida</label>
      <div class="contador">
        <button type="button" id="v-menos">−</button>
        <input id="v-cant" type="number" min="1" value="1" inputmode="numeric">
        <button type="button" id="v-mas">+</button>
      </div></div>
    <div class="dos">
      <div class="campo"><label for="v-pre">Precio unitario</label>
        <input id="v-pre" type="number" min="0" inputmode="numeric" value="${Number(f.precio)||0}"></div>
      <div class="campo"><label for="v-cli">Cliente (opcional)</label><input id="v-cli"></div>
    </div>
    <div class="campo"><label for="v-not">Nota (opcional)</label><input id="v-not" placeholder="Pedido para baby shower"></div>
    <div class="acciones"><button class="btn btn-verde" id="v-ok">Registrar y descontar</button></div>`);

  const h = capa.querySelector('.hoja'), c = h.querySelector('#v-cant');
  h.querySelector('#v-mas').addEventListener('click', ()=>{ c.value = (Number(c.value)||0)+1; });
  h.querySelector('#v-menos').addEventListener('click', ()=>{ c.value = Math.max(1,(Number(c.value)||1)-1); });

  h.querySelector('#v-ok').addEventListener('click', async ev=>{
    const cantidad = Math.max(1, Number(c.value)||1);
    const precio = Number(h.querySelector('#v-pre').value)||0;
    if (cantidad > (Number(f.existencia)||0)){ brindis('No puede vender más de lo que tiene en bodega.'); return; }
    ev.currentTarget.disabled = true;

    const venta = {id:f.id, codigo:f.codigo, nombre:f.nombre, cantidad:cantidad, precio:precio,
                   cliente:h.querySelector('#v-cli').value, nota:h.querySelector('#v-not').value};
    f.existencia = Math.max(0, (Number(f.existencia)||0) - cantidad);
    const i = figuras.findIndex(x=>x.id===f.id);
    if (i>=0) figuras[i] = f;
    ventas.push(Object.assign({fecha:new Date().toISOString(), total:cantidad*precio}, venta));
    await cache.set('figuras', figuras); await cache.set('ventas', ventas);
    cerrar(); pintar();

    const enviado = await encolar('venta', venta);
    brindis(enviado || !config.url
      ? `Venta registrada. Quedan ${f.existencia}.`
      : `Venta guardada en el celular. Sube sola al reconectar.`);
  });
}

/* ══════════ reportes ══════════ */
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio',
                     'agosto','septiembre','octubre','noviembre','diciembre'];

function porMes(n){
  const mapa = new Map();
  const hoy = new Date();
  for (let i = n-1; i >= 0; i--){
    const d = new Date(hoy.getFullYear(), hoy.getMonth()-i, 1);
    const clave = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    mapa.set(clave, {clave:clave, etiqueta: MESES[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2),
                     unidades:0, ingresos:0});
  }
  ventas.forEach(v=>{
    const d = new Date(v.fecha);
    if (isNaN(d)) return;
    const clave = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const m = mapa.get(clave);
    if (m){ m.unidades += Number(v.cantidad)||0; m.ingresos += Number(v.total)||0; }
  });
  return [...mapa.values()];
}

function estacionalidad(){
  const acum = MESES.map(()=>({unidades:0, ingresos:0, años:new Set()}));
  ventas.forEach(v=>{
    const d = new Date(v.fecha);
    if (isNaN(d)) return;
    const a = acum[d.getMonth()];
    a.unidades += Number(v.cantidad)||0;
    a.ingresos += Number(v.total)||0;
    a.años.add(d.getFullYear());
  });
  return acum.map((a,i)=>({
    mes: MESES_LARGO[i],
    unidades: a.unidades,
    ingresos: a.ingresos,
    años: a.años.size,
    promedio: a.años.size ? a.unidades/a.años.size : 0,
  }));
}

function topFiguras(desdeDias, limite){
  const corte = Date.now() - desdeDias*86400000;
  const mapa = new Map();
  ventas.forEach(v=>{
    if (new Date(v.fecha).getTime() < corte) return;
    const k = String(v.id);
    const m = mapa.get(k) || {nombre:v.nombre, codigo:v.codigo, unidades:0, ingresos:0};
    m.unidades += Number(v.cantidad)||0;
    m.ingresos += Number(v.total)||0;
    mapa.set(k, m);
  });
  return [...mapa.values()].sort((a,b)=>b.unidades-a.unidades).slice(0, limite||15);
}

/* Excel abre bien el CSV con punto y coma y marca de orden de bytes. */
function descargarCSV(nombre, filas){
  const esc1 = c => {
    const s = String(c == null ? '' : c);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const texto = '\uFEFF' + filas.map(f=>f.map(esc1).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], {type:'text/csv;charset=utf-8'}));
  a.download = nombre;
  a.click();
  URL.revokeObjectURL(a.href);
}

function csvInventario(){
  const filas = [['Codigo','Nombre','Categoria','Palabras de busqueda','Estado','En bodega',
                  'Avisar en','Precio','Valor en bodega','Molde','Dias produccion','Medidas','Ubicacion','Notas']];
  figuras.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es')).forEach(f=>{
    filas.push([f.codigo, f.nombre, f.categoria, f.claves, etiqueta(f), Number(f.existencia)||0,
                Number(f.minimo)||0, Number(f.precio)||0,
                (Number(f.existencia)||0)*(Number(f.precio)||0),
                f.molde, Number(f.dias)||0, f.medidas, f.ubicacion, f.notas]);
  });
  descargarCSV(`inventario-${new Date().toISOString().slice(0,10)}.csv`, filas);
}

function csvVentas(){
  if (!ventas.length){ brindis('Todavía no hay ventas registradas.'); return; }
  const filas = [['Fecha','Ano','Mes','Codigo','Figura','Cantidad','Precio unitario','Total','Cliente','Nota']];
  ventas.slice().sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).forEach(v=>{
    const d = new Date(v.fecha);
    filas.push([d.toISOString().slice(0,10), d.getFullYear(), MESES_LARGO[d.getMonth()],
                v.codigo, v.nombre, Number(v.cantidad)||0, Number(v.precio)||0,
                Number(v.total)||0, v.cliente||'', v.nota||'']);
  });
  descargarCSV(`ventas-${new Date().toISOString().slice(0,10)}.csv`, filas);
}

function imprimirReporte(){
  const meses = porMes(12);
  const est = estacionalidad().filter(m=>m.unidades>0).sort((a,b)=>b.unidades-a.unidades);
  const top = topFiguras(365, 20);
  const listas = figuras.filter(f=>estado(f)==='listo');
  const piezas = listas.reduce((s,f)=>s+(Number(f.existencia)||0),0);
  const valor  = listas.reduce((s,f)=>s+(Number(f.existencia)||0)*(Number(f.precio)||0),0);
  const bajas  = figuras.filter(f=>estado(f)==='listo' && Number(f.existencia) <= umbral(f));
  const hoy = new Date();

  const tabla = (cabeceras, filas) => filas.length

       <tbody>${filas.map(f=>`<tr>${f.map((c,i)=>`<td${i?' class="num"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`
    : `<p style="font-size:9.5pt;color:#666">Sin datos todavía.</p>`;

  document.getElementById('impresion').innerHTML = `
    <h1>Filemón · Reporte de inventario y ventas</h1>
    <div style="font-size:9pt;color:#555">
      Generado el ${hoy.getDate()} de ${MESES_LARGO[hoy.getMonth()]} de ${hoy.getFullYear()}
    </div>

    <h2>Resumen</h2>
    ${tabla(['Indicador','Valor'], [
      ['Figuras registradas', figuras.length],
      ['Piezas listas en bodega', piezas],
      ['Valor de lo que está listo', pesos(valor)],
      ['Figuras por reponer', bajas.length],
      ['Moldes dañados', figuras.filter(f=>f.molde==='danado').length],
      ['Ventas registradas', ventas.length],
    ])}

    <h2>Ventas mes a mes (últimos 12 meses)</h2>
    ${tabla(['Mes','Unidades','Ingresos'],
      meses.map(m=>[m.etiqueta, m.unidades, pesos(m.ingresos)]))}

    <h2>Meses fuertes (todos los años juntos)</h2>
    ${est.length
      ? tabla(['Mes','Unidades','Ingresos','Años con datos'],
          est.map(m=>[m.mes, m.unidades, pesos(m.ingresos), m.años]))
        + `<p style="font-size:8.5pt;color:#666;margin-top:5pt">
             ${est.some(m=>m.años>1)
               ? 'Con más de un año de datos, esta tabla ya indica temporada.'
               : 'Todavía hay menos de un año de historia: esta tabla muestra lo vendido, no una temporada confirmada.'}
           </p>`
      : `<p style="font-size:9.5pt;color:#666">Se necesita al menos un año de ventas registradas para hablar de temporadas.</p>`}

    <h2>Figuras más vendidas (últimos 12 meses)</h2>
    ${tabla(['Figura','Código','Unidades','Ingresos'],
      top.map(t=>[t.nombre, t.codigo, t.unidades, pesos(t.ingresos)]))}

    <h2>Por reponer</h2>
    ${tabla(['Figura','En bodega','Avisar en','Días de producción'],
      bajas.map(f=>[f.nombre, Number(f.existencia)||0, umbral(f), Number(f.dias)||0]))}

    <div class="pie">Documento interno de Filemón. Generado desde el inventario.</div>`;

  cerrar();
  setTimeout(()=>window.print(), 120);
}

  const meses = porMes(12);
  const maxU = Math.max(1, ...meses.map(m=>m.unidades));
  const pico = Math.max(...meses.map(m=>m.unidades));
  const conVentas = ventas.length > 0;

  const capa = abrir(`
    <div class="hoja-top"><h2>Reportes</h2><button class="cerrar">×</button></div>

    <div class="campo"><label>Ventas mes a mes</label>
      ${conVentas
        ? meses.map(m=>`
            <div class="barra${m.unidades===pico && pico>0 ? ' pico':''}">
              <span>${m.etiqueta}</span>
              <span style="flex:1"><i style="width:${Math.round(m.unidades/maxU*100)}%"></i></span>
              <span class="val">${m.unidades}</span>
            </div>`).join('')
        : `<span class="pista">Aún no hay ventas registradas. En cuanto empiece a registrarlas,
             aquí va a ver de un vistazo cuáles son sus meses fuertes.</span>`}
    </div>

    <div class="campo"><label>Descargar para Excel</label>
      <button class="btn btn-borde" id="r-inv" style="width:100%">Inventario completo</button>
      <button class="btn btn-borde" id="r-ven" style="width:100%;margin-top:7px">Historial de ventas</button>
      <span class="pista">Se descargan como CSV: se abren directo en Excel con doble clic.</span></div>

    <div class="campo"><label>Reporte en PDF</label>
      <button class="btn btn-primario" id="r-pdf" style="width:100%">Generar reporte</button>
      <span class="pista">Se abre la ventana de impresión: elija <b>Guardar como PDF</b> en el destino.</span></div>

    ${config.url ? `<div class="aviso" style="margin-top:16px">
      Para el análisis por temporada con varios años, ejecute <b>generarReporte</b> desde
      Apps Script: arma una hoja REPORTE que puede descargar como Excel o PDF desde el menú
      Archivo de Google Sheets.</div>` : ''}`);

  const h = capa.querySelector('.hoja');
  h.querySelector('#r-inv').addEventListener('click', ()=>{
    if (!figuras.length){ brindis('Todavía no hay figuras registradas.'); return; }
    csvInventario(); brindis('Inventario descargado.');
  });
  h.querySelector('#r-ven').addEventListener('click', csvVentas);
  h.querySelector('#r-pdf').addEventListener('click', imprimirReporte);

/* ══════════ menú ══════════ */
function abrirMenu(){
  const listas = figuras.filter(f=>estado(f)==='listo');
  const bajas  = figuras.filter(f=>estado(f)==='listo' && Number(f.existencia) <= umbral(f));
  const danados= figuras.filter(f=>f.molde==='danado');
  const piezas = listas.reduce((s,f)=>s+(Number(f.existencia)||0),0);
  const valor  = listas.reduce((s,f)=>s+(Number(f.existencia)||0)*(Number(f.precio)||0),0);

  const mes = ventas.filter(v=>new Date(v.fecha).getTime() >= Date.now()-30*86400000);
  const vendidoMes = mes.reduce((s,v)=>s+(Number(v.total)||0),0);

  const producir = figuras.map(f=>{
    const v = vendidasDesde(f.id, 30);
    const dia = v/30;
    const cobertura = dia > 0 ? (Number(f.existencia)||0)/dia : Infinity;
    return {f:f, v:v, cobertura:cobertura};
  }).filter(x=>x.v>0 && x.cobertura < 21 && x.f.molde==='bueno')
    .sort((a,b)=>a.cobertura-b.cobertura).slice(0,6);

  const capa = abrir(`
    <div class="hoja-top"><h2>El taller hoy</h2><button class="cerrar">×</button></div>

    <div class="tarjetas">
      <div class="tarjeta"><b>${figuras.length}</b><span>Figuras registradas</span></div>
      <div class="tarjeta"><b>${piezas}</b><span>Piezas en bodega</span></div>
      <div class="tarjeta"><b>${bajas.length}</b><span>Se están acabando</span></div>
      <div class="tarjeta"><b>${danados.length}</b><span>Moldes dañados</span></div>
    </div>

    <div class="aviso">Inventario listo para vender: <b>${pesos(valor)}</b><br>
      Vendido en los últimos 30 días: <b>${pesos(vendidoMes)}</b></div>

    ${producir.length ? `<div class="campo"><label>Qué producir primero</label>
      ${producir.map(x=>`<div style="background:#fff;border:1px solid var(--linea);border-left:4px solid var(--encargo);
        border-radius:3px;padding:11px 12px;margin-bottom:7px;font-size:13.5px;line-height:1.5">
        <b>${esc(x.f.nombre)}</b><br>
        <span style="color:var(--pizarra-2)">Vendió ${x.v} en 30 días · quedan ${x.f.existencia} ·
        ${x.cobertura < 1 ? 'agotada' : 'alcanza ~' + Math.round(x.cobertura) + ' días'}</span></div>`).join('')}
      <span class="pista">Calculado con el ritmo de venta de los últimos 30 días.</span></div>`
    : `<div class="campo"><label>Qué producir primero</label>
        <span class="pista">Registre ventas por unos días y aquí le aparecerá qué reponer, ordenado por urgencia.</span></div>`}

    <div class="campo" style="margin-top:18px"><label>Reportes</label>
      <button class="btn btn-borde" id="verReportes" style="width:100%">Ventas por mes, Excel y PDF</button></div>

    <div class="campo" style="margin-top:18px"><label>Cargar su catálogo</label>
      <button class="btn btn-borde" id="importarFotos" style="width:100%">Importar desde las fotos</button>
      <span class="pista">Lee los nombres de sus archivos y crea las figuras con las palabras de búsqueda ya puestas.</span></div>

    <div class="campo" style="margin-top:18px"><label>Conexión con Google Sheets</label>
      <input id="cfg-url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(config.url)}">
      <span class="pista">Dirección de la aplicación web de Apps Script.</span></div>
    <div class="campo">
      <input id="cfg-clave" placeholder="Clave secreta" value="${esc(config.clave)}">
      <span class="pista">La misma que puso en la variable CLAVE del script.</span></div>
    <div class="acciones" style="margin-top:6px">
      <button class="btn btn-primario" id="cfg-ok">Guardar conexión</button>
      <button class="btn btn-borde" id="cfg-sync">Sincronizar</button>
    </div>

    <div class="campo" style="margin-top:22px"><label>Respaldo local</label>
      <button class="btn btn-borde" id="exportar" style="width:100%">Descargar respaldo</button></div>
    <div class="campo">
      <button class="btn btn-borde" id="importarBtn" style="width:100%">Cargar respaldo o subir todo a la hoja</button>
      <input type="file" id="importar" accept="application/json" style="display:none">
      <span class="pista">Sirve para pasar lo que ya tenía registrado a su hoja de cálculo.</span></div>`);

  const h = capa.querySelector('.hoja');

  h.querySelector('#verReportes').addEventListener('click', abrirReportes);
  h.querySelector('#importarFotos').addEventListener('click', abrirImportador);

  h.querySelector('#cfg-ok').addEventListener('click', async ()=>{
    config.url = h.querySelector('#cfg-url').value.trim();
    config.clave = h.querySelector('#cfg-clave').value.trim();
    await cache.set('config', config);
    brindis('Conexión guardada.');
    sincronizar();
  });
  h.querySelector('#cfg-sync').addEventListener('click', ()=>{ cerrar(); sincronizar(); });

  h.querySelector('#exportar').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify({figuras, ventas, fecha:new Date().toISOString()}, null, 2)],
                          {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `filemon-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    brindis('Respaldo descargado.');
  });

  h.querySelector('#importarBtn').addEventListener('click', ()=>h.querySelector('#importar').click());
  h.querySelector('#importar').addEventListener('change', ev=>{
    const arch = ev.target.files && ev.target.files[0];
    if (!arch) return;
    const lector = new FileReader();
    lector.onload = async ()=>{
      try{
        const d = JSON.parse(lector.result);
        if (!Array.isArray(d.figuras)) throw new Error('formato');
        const fotos = d.fotos || {};
        figuras = d.figuras.map(f=>Object.assign({}, f, {foto:f.foto||''}));
        ventas = d.ventas || ventas;
        await cache.set('figuras', figuras); await cache.set('ventas', ventas);
        cerrar(); pintar();

        if (!config.url){
          brindis(`${figuras.length} figuras cargadas. Conecte la hoja para subirlas.`);
          return;
        }
        figuras.forEach(f=>{
          const op = Object.assign({}, f);
          if (fotos[f.id]) op.fotoBase64 = fotos[f.id];
          cola.push({tipo:'guardar', datos:op});
        });
        await guardarCola(); pintar();
        const enviado = await drenar(false);
        if (enviado){ await sincronizar(true); brindis(`${figuras.length} figuras subidas a la hoja.`); }
        else brindis('Quedaron cambios sin enviar. Toque el punto de arriba para reintentar.');
      } catch(e){ brindis('Ese archivo no es un respaldo válido.'); }
    };
    lector.readAsText(arch);
  });
}
