<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#33220F">
<title>Filemón · Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">
<style>
  :root{
    /* Sacada del logo: melena #301800, león #FCB40C, hocico #FCE4B4, palabra #A86C18 */
    --yeso:#F6EEDF; --yeso-alto:#FDF8EF; --pizarra:#33220F; --pizarra-2:#5A4630;
    --grafito:#241708; --tiza:#96866C; --linea:#E2D5BE;
    --melena:#33220F; --leon:#FCB40C; --leon-hondo:#D89100; --hocico:#FCE4B4;
    --listo:#1F6B4A; --encargo:#B8651A; --alerta:#9E3025; --tinta:#A86C18;
    --display:'Fredoka',system-ui,sans-serif;
    --texto:'Public Sans',system-ui,sans-serif;
    --dato:'IBM Plex Mono',ui-monospace,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--texto);color:var(--grafito);background:var(--yeso);
       background-image:radial-gradient(rgba(255,255,255,.6) 1px,transparent 1px);
       background-size:5px 5px;-webkit-font-smoothing:antialiased}
  #app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:104px}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:16px}
  :focus-visible{outline:2.5px solid var(--leon-hondo);outline-offset:2px}

  .top{background:var(--pizarra);color:var(--yeso-alto);padding:16px 18px 14px;
       position:sticky;top:0;z-index:40;box-shadow:0 6px 18px rgba(43,52,57,.16)}
  .marca{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
  .marca-izq{display:flex;align-items:center;gap:9px;min-width:0}
  .leon{width:34px;height:34px;flex:0 0 34px;object-fit:contain;display:block}
  .marca h1{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:0;margin:0;color:#fff}
  .sync{display:flex;align-items:center;gap:7px;background:none;border:none;font-family:var(--dato);
        font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,232,227,.75);padding:6px 4px}
  .punto{width:8px;height:8px;border-radius:50%;background:var(--tiza);flex:0 0 8px}
  .punto.ok{background:#4FCF9C} .punto.mal{background:#E07A6E} .punto.trab{background:#E0B96E}
  @media (prefers-reduced-motion:no-preference){ .punto.trab{animation:late 1s ease-in-out infinite} }
  @keyframes late{50%{opacity:.35}}

  .buscar{position:relative}
  .buscar input{width:100%;padding:15px 44px 15px 16px;border:none;border-radius:10px;
                background:var(--yeso-alto);color:var(--grafito);font-size:17px;font-weight:500}
  .buscar input::placeholder{color:#9A9A93;font-weight:400}
  .limpiar{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:transparent;
           color:var(--tiza);font-size:22px;line-height:1;padding:8px 10px}

  .chips{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-family:var(--dato);font-size:11px;letter-spacing:.06em;padding:7px 11px;
        border-radius:20px;border:1px solid rgba(253,248,239,.3);background:transparent;
        color:rgba(232,232,227,.82);text-transform:uppercase}
  .chip[aria-pressed="true"]{background:var(--yeso-alto);color:var(--pizarra);border-color:var(--yeso-alto);font-weight:600}

  .respuesta{margin:14px 14px 0;background:#fff;border:1px solid var(--linea);
             border-left:5px solid var(--leon);border-radius:8px;padding:15px 16px}
  .eyebrow{font-family:var(--dato);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
           color:var(--tiza);display:block;margin-bottom:9px}
  .respuesta p{margin:0 0 13px;font-size:15px;line-height:1.55;white-space:pre-wrap}
  .copiar{width:100%;padding:13px;border:none;border-radius:8px;background:var(--pizarra);color:#fff;
          font-family:var(--dato);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .copiar.ok{background:var(--listo)}

  .sello{display:inline-block;font-family:var(--dato);font-weight:600;font-size:10.5px;letter-spacing:.1em;
         text-transform:uppercase;padding:4px 10px;border:1.5px solid currentColor;border-radius:20px}
  .sello.listo{color:var(--listo)} .sello.encargo{color:var(--encargo)}
  .sello.no{color:var(--alerta)} .sello.vacio{color:var(--tiza)}

  .cuerpo{padding:14px}
  .conteo{font-family:var(--dato);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
          color:var(--tiza);margin:4px 2px 11px}
  .ficha{display:flex;gap:13px;background:#fff;border:1px solid var(--linea);border-radius:10px;
         padding:11px;margin-bottom:9px;width:100%;text-align:left;position:relative;align-items:center}
  .ficha:active{background:#FAFAF7}
  .ficha.pend::after{content:'';position:absolute;top:7px;right:7px;width:7px;height:7px;
                     border-radius:50%;background:#E0B96E}
  .foto{width:92px;height:92px;flex:0 0 92px;border-radius:7px;background:var(--yeso);overflow:hidden;
        display:flex;align-items:center;justify-content:center;font-family:var(--dato);
        font-size:9px;color:#B4B4AC;letter-spacing:.06em}
  .foto img{width:100%;height:100%;object-fit:contain;display:block}
  .info{flex:1;min-width:0}
  .cod{font-family:var(--dato);font-size:10.5px;color:var(--tiza);letter-spacing:.08em}
  .nom{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:0;
       margin:3px 0 7px;line-height:1.18;overflow-wrap:anywhere;color:var(--melena)}
  .nom.gris{color:var(--tiza);font-style:italic}
  .pie{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .cant{flex:0 0 auto;text-align:center;padding-left:8px;border-left:1px solid var(--linea);min-width:56px}
  .cant b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--melena)}
  .cant span{display:block;font-family:var(--dato);font-size:9px;color:var(--tiza);letter-spacing:.08em;margin-top:3px}

  /* Los moldes se ven en cuadrícula: el producto es visual y la foto manda. */
  .rejilla{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
  @media (min-width:560px){ .rejilla{grid-template-columns:repeat(3,1fr)} }
  .tarjeta-molde{background:#fff;border:1px solid var(--linea);border-radius:10px;overflow:hidden;
                 padding:0;text-align:left;width:100%;position:relative;display:block}
  .tarjeta-molde:active{background:#FFFCF6}
  .tarjeta-molde .lienzo{aspect-ratio:1;background:var(--yeso);display:flex;
                         align-items:center;justify-content:center;overflow:hidden}
  .tarjeta-molde .lienzo img{width:100%;height:100%;object-fit:contain;display:block}
  .tarjeta-molde .lienzo span{font-family:var(--dato);font-size:10px;color:var(--tiza)}
  .tarjeta-molde .txt{padding:10px 11px 12px}
  .tarjeta-molde .nom{font-size:15.5px;margin:2px 0 6px}
  .tarjeta-molde .cod{font-family:var(--dato);font-size:10px;color:var(--tiza);letter-spacing:.08em}
  .cinta{position:absolute;top:8px;right:8px;background:var(--melena);color:var(--yeso-alto);
         font-family:var(--dato);font-size:10px;letter-spacing:.06em;padding:4px 8px;border-radius:20px}
  .cinta.aviso-falta{background:var(--encargo)}
  .cinta.mal{background:var(--alerta)}

  .vacio{text-align:center;padding:48px 26px}
  .vacio h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0 0 8px;color:var(--melena)}
  .vacio p{color:var(--pizarra-2);font-size:14.5px;line-height:1.6;margin:0 0 20px}

  .btn{border:none;border-radius:8px;padding:13px 18px;font-family:var(--dato);
       font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .btn-primario{background:var(--pizarra);color:#fff}
  .btn-borde{background:transparent;color:var(--pizarra);border:1.5px solid var(--pizarra)}
  .btn-peligro{background:transparent;color:var(--alerta);border:1.5px solid var(--alerta)}
  .btn-verde{background:var(--listo);color:#fff}
  .btn[disabled]{opacity:.5;pointer-events:none}

  .flotante{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:45;display:flex;gap:9px}
  .flotante .btn{box-shadow:0 5px 16px rgba(43,52,57,.3);padding:14px 18px}
  .btn-mas{background:var(--leon);color:var(--melena);font-weight:600}

  .capa{position:fixed;inset:0;background:rgba(26,31,34,.55);z-index:60;
        display:flex;align-items:flex-end;justify-content:center}
  .hoja{background:var(--yeso-alto);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;
        border-radius:18px 18px 0 0;padding:20px 18px 30px}
  .hoja-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
  .hoja-top h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0;color:var(--melena)}
  .cerrar{border:none;background:transparent;font-size:27px;line-height:1;color:var(--tiza);padding:0 4px}

  .campo{margin-bottom:14px}
  .campo label{display:block;font-family:var(--dato);font-size:10px;letter-spacing:.12em;
               text-transform:uppercase;color:var(--pizarra-2);margin-bottom:5px}
  .campo input,.campo textarea,.campo select{width:100%;padding:12px 13px;border:1px solid var(--linea);
                                             border-radius:9px;background:#fff;color:var(--grafito)}
  .campo textarea{resize:vertical;min-height:58px;line-height:1.5}
  .pista{display:block;margin-top:5px;font-size:12px;color:var(--tiza);line-height:1.45;
         font-family:var(--texto);letter-spacing:0;text-transform:none}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:11px}

  .contador{display:flex;align-items:center;gap:12px}
  .contador button{width:48px;height:48px;border:1.5px solid var(--pizarra);background:#fff;
                   border-radius:9px;font-size:22px;line-height:1;color:var(--pizarra)}
  .contador input{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:24px}

  .foto-caja{display:flex;gap:13px;align-items:flex-start;margin-bottom:16px;padding:13px;
             background:#fff;border:1px solid var(--linea);border-radius:3px}
  .foto-prev{width:120px;height:120px;flex:0 0 120px;border-radius:2px;background:#F4F4F0;overflow:hidden;
             display:flex;align-items:center;justify-content:center;font-family:var(--dato);
             font-size:9px;color:#B4B4AC}
  .foto-prev img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .18s ease}
  .girar{display:flex;gap:7px;margin-top:7px}
  .girar button{flex:1;padding:10px;border:1.5px solid var(--pizarra);background:#fff;
                border-radius:3px;font-size:17px;line-height:1;color:var(--pizarra)}

  .lista-piezas{background:#fff;border:1px solid var(--linea);border-radius:10px;overflow:hidden}
  .pieza{display:flex;align-items:center;gap:11px;padding:10px 12px;border-bottom:1px solid var(--linea);
         width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none}
  .pieza:last-child{border-bottom:none}
  .pieza:active{background:#FAFAF7}
  .pieza .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--pizarra);color:#fff;
            display:flex;align-items:center;justify-content:center;font-family:var(--dato);font-size:11px}
  .pieza .n.sin{background:var(--tiza)}
  .pieza .t{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere}
  .pieza .t i{color:var(--tiza);font-size:13px}
  .pieza .e{flex:0 0 auto;font-family:var(--dato);font-size:12px;color:var(--pizarra-2)}

  .aviso{background:#fff;border:1px solid var(--linea);border-left:4px solid var(--encargo);
         padding:12px 14px;border-radius:9px;font-size:13.5px;line-height:1.55;margin-bottom:14px}
  .acciones{display:flex;gap:9px;margin-top:20px}
  .acciones .btn{flex:1}

  .tarjetas{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:18px}
  .tarjeta{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:14px}
  .tarjeta b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;display:block;color:var(--melena)}
  .tarjeta span{font-family:var(--dato);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
                color:var(--tiza);margin-top:5px;display:block}

  .barra{display:flex;align-items:center;gap:9px;margin-bottom:6px;font-size:13px}
  .barra span:first-child{flex:0 0 62px;font-family:var(--dato);font-size:11px;color:var(--pizarra-2)}
  .barra i{display:block;height:16px;background:var(--leon-hondo);border-radius:2px;min-width:2px}
  .barra .val{flex:0 0 auto;font-family:var(--dato);font-size:11px;color:var(--tiza)}
  .barra.pico i{background:var(--encargo)}

  .brindis{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--pizarra);
           color:#fff;padding:11px 18px;border-radius:3px;font-size:13.5px;z-index:80;
           box-shadow:0 5px 16px rgba(0,0,0,.25);max-width:88%;text-align:center}
  @media (prefers-reduced-motion:no-preference){
    .brindis{animation:sube .22s ease-out}
    @keyframes sube{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  }

  .visor{position:fixed;inset:0;background:rgba(18,21,23,.97);z-index:90;
         display:flex;flex-direction:column;touch-action:none}
  .visor-lienzo{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;
                align-items:center;justify-content:center;position:relative}
  .visor-lienzo img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;
                    will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .visor-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
             padding:12px 16px 8px;color:var(--yeso-alto)}
  .visor-top h3{font-family:var(--display);font-weight:600;font-size:17px;margin:0;
                letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .visor-top .cod{color:rgba(232,232,227,.6);margin-top:2px}
  .visor-x{border:none;background:transparent;color:var(--yeso-alto);font-size:30px;line-height:1;padding:0 6px}
  .visor-bar{flex:0 0 auto;display:flex;gap:8px;padding:8px 16px 4px;justify-content:center}
  .visor-bar button{flex:1 1 0;min-width:0;max-width:78px;height:44px;
                    border:1px solid rgba(232,232,227,.3);background:transparent;
                    color:var(--yeso-alto);border-radius:3px;font-size:17px;line-height:1;
                    font-family:var(--dato);letter-spacing:.02em}
  .visor-bar button[data-a="ajustar"],.visor-bar button[data-a="llenar"]{font-size:11px;letter-spacing:.06em}
  .visor-bar button:active{background:rgba(232,232,227,.15)}
  .visor-piezas{flex:0 0 auto;overflow-x:auto;overflow-y:hidden;padding:6px 12px 14px;
                display:flex;flex-wrap:nowrap;gap:7px;scrollbar-width:none}
  .visor-piezas::-webkit-scrollbar{display:none}
  .vp{flex:0 0 auto;white-space:nowrap;display:flex;align-items:center;gap:7px;border:1px solid rgba(232,232,227,.26);border-radius:3px;
      padding:7px 10px;background:transparent;color:var(--yeso-alto);font-size:13px;max-width:100%}
  .vp b{font-family:var(--dato);font-size:11px;background:var(--yeso-alto);color:var(--pizarra);
        border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:0 0 22px}
  .vp.sin{color:rgba(232,232,227,.55);font-style:italic}
  .visor-guardar{flex:0 0 auto;padding:8px 16px 0;display:flex}
  .visor-guardar .btn{flex:1}
  .visor-tip{flex:0 0 auto;text-align:center;color:rgba(232,232,227,.45);font-size:11px;padding:0 16px 6px}

  #impresion{display:none}
  @media print{
    .top,.flotante,.capa,.brindis,#panel,.cuerpo{display:none !important}
    #app{padding:0;max-width:none;background:#fff}
    #impresion{display:block;color:#000;font-size:11pt}
    #impresion h1{font-family:var(--display);font-weight:700;font-size:20pt;margin:0 0 2pt}
    #impresion h2{font-family:var(--display);font-size:12pt;margin:16pt 0 5pt;
                  border-bottom:1pt solid #999;padding-bottom:3pt}
    #impresion table{width:100%;border-collapse:collapse;font-size:9.5pt}
    #impresion th{text-align:left;border-bottom:1pt solid #333;padding:4pt 3pt;font-size:8pt;
                  text-transform:uppercase;letter-spacing:.05em}
    #impresion td{border-bottom:.5pt solid #ccc;padding:4pt 3pt}
    #impresion .num{text-align:right}
    #impresion .pie{margin-top:14pt;font-size:8pt;color:#555}
    @page{margin:14mm}
  }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="marca">
      <div class="marca-izq"><img src="icono.png" alt="" class="leon"><h1>Filemón</h1></div>
      <button class="sync" id="btnSync"><span class="punto" id="punto"></span><span id="txtSync">Sin conectar</span></button>
    </div>
    <div class="buscar">
      <input id="q" type="search" placeholder="¿Tienes osos?  Escriba aquí…" autocomplete="off">
      <button class="limpiar" id="limpiar" aria-label="Limpiar" style="display:none">×</button>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-f="todas" aria-pressed="true">Piezas</button>
      <button class="chip" data-f="listo" aria-pressed="false">En bodega</button>
      <button class="chip" data-f="sinnombre" aria-pressed="false">Sin nombre</button>
      <button class="chip" data-f="bajo" aria-pressed="false">Se acaba</button>
      <button class="chip" data-f="moldes" aria-pressed="false">Moldes</button>
    </div>
  </div>

  <div id="panel"></div>
  <div class="cuerpo">
    <div class="conteo" id="conteo"></div>
    <div id="lista"></div>
  </div>

  <div id="impresion"></div>

  <div class="flotante">
    <button class="btn btn-mas" id="nuevo">+ Molde</button>
    <button class="btn btn-primario" id="menu">···</button>
  </div>
</div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const app = $('#app');

let moldes = [], piezas = [], productos = [], ventas = [], cola = [];
let config = {url:'', clave:''};
let filtro = 'todas', consulta = '', sincronizando = false, drenando = false, listo = false;

/* ══════════ caché local ══════════ */
const cache = {
  async get(k){
    try { if (window.storage){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; } } catch(e){}
    try { const v = localStorage.getItem('filemon:'+k); return v ? JSON.parse(v) : null; } catch(e){ return null; }
  },
  async set(k,v){
    try { if (window.storage){ await window.storage.set(k, JSON.stringify(v)); return; } } catch(e){}
    try { localStorage.setItem('filemon:'+k, JSON.stringify(v)); } catch(e){}
  }
};

/* ══════════ utilidades ══════════ */
const limpio = t => (t||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const pesos  = n => '$' + (Number(n)||0).toLocaleString('es-CO',{maximumFractionDigits:0});
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const VACIAS = new Set(['y','o','de','del','la','el','los','las','un','una','con','en','para','al','a','e']);

function variantes(p){
  const v = new Set([p]);
  if (p.length > 4 && p.endsWith('es')) v.add(p.slice(0,-2));
  else if (p.length > 3 && p.endsWith('s')) v.add(p.slice(0,-1));
  else v.add(p + (/[aeiou]$/.test(p) ? 's' : 'es'));
  v.forEach(b=>{
    const m = b.match(/^(.+)(it[ao])s?$/);
    if (m && m[1].length > 2) v.add(m[1] + (m[2]==='ita' ? 'a' : 'o'));
    else if (/[ao]$/.test(b) && b.length > 3){
      const r = b.slice(0,-1);
      v.add((r.endsWith('i') ? r.slice(0,-1) : r) + (b.endsWith('a') ? 'ita' : 'ito'));
    }
  });
  return v;
}

function clavesDe(texto){
  const s = new Set();
  String(texto||'').split(/\s+/).forEach(t=>{
    const n = limpio(t).replace(/[^a-z0-9]/g,'');
    if (n && !VACIAS.has(n)) variantes(n).forEach(v=>s.add(v));
  });
  return [...s].join(', ');
}

const moldeDe = p => moldes.find(m=>m.id === p.idMolde) || {};
const piezasDe = id => piezas.filter(p=>p.idMolde === id).sort((a,b)=>(a.numero||0)-(b.numero||0));
const sinNombre = p => !String(p.nombre||'').trim();
const umbral = p => (p.minimo === 0 || Number(p.minimo)) ? Number(p.minimo) : 3;

/* Faltan piezas por registrar si el molde declara más cavidades que las que tiene. */
const faltan = m => Math.max(0, (Number(m.cavidades)||0) - piezasDe(m.id).length);

function estado(p){
  const m = moldeDe(p);
  if (m.estado === 'danado' || m.estado === 'sinmolde') return 'no';
  if (sinNombre(p)) return 'vacio';
  return (Number(p.existencia)||0) > 0 ? 'listo' : 'encargo';
}

function etiqueta(p){
  const e = estado(p);
  if (e === 'listo') return 'En bodega';
  if (e === 'encargo') return 'Por encargo';
  if (e === 'vacio') return 'Sin nombre';
  return moldeDe(p).estado === 'danado' ? 'Molde dañado' : 'No la manejo';
}

function brindis(msg){
  document.querySelectorAll('.brindis').forEach(b=>b.remove());
  const d = document.createElement('div');
  d.className = 'brindis'; d.textContent = msg;
  app.appendChild(d); setTimeout(()=>d.remove(), 2800);
}

/* ══════════ puente con la hoja ══════════ */
async function api(accion, datos){
  if (!config.url) throw new Error('Falta conectar la hoja');
  const r = await fetch(config.url, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({token:config.clave, accion:accion, datos:datos||{}})
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Error del servidor');
  return j.datos;
}

function marcaSync(clase, texto){
  $('#punto').className = 'punto ' + clase;
  $('#txtSync').textContent = texto;
}

/* Toda modificación entra a una cola y se envía en orden. Sin señal, la cola
   espera en el celular; nada se pierde ni se revierte al sincronizar. */
function idsEnCola(){
  const s = new Set();
  cola.forEach(op=>{
    const d = op.datos || {};
    if (d.id) s.add(String(d.id));
    (d.piezas||[]).forEach(p=>{ if (p.id) s.add(String(p.id)); });
  });
  return s;
}

async function guardarCola(){ try { await cache.set('cola', cola); } catch(e){} }

async function encolar(tipo, datos){
  cola.push({tipo:tipo, datos:datos});
  await guardarCola();
  pintar();
  return drenar(true);
}

async function drenar(silencioso){
  if (!config.url || !cola.length || drenando) return !cola.length;
  drenando = true;
  marcaSync('trab','Enviando');
  try{
    while (cola.length){
      await api(cola[0].tipo, cola[0].datos);
      cola.shift();
      await guardarCola();
    }
    marcaSync('ok','Al día');
    pintar();
    return true;
  } catch(err){
    marcaSync('mal', `Sin enviar (${cola.length})`);
    if (!silencioso) brindis('No se pudo enviar: ' + err.message);
    pintar();
    return false;
  } finally { drenando = false; }
}

async function sincronizar(silencioso){
  if (sincronizando || !config.url) return;
  sincronizando = true;
  try{
    const pendientes = cola.length;
    if (!await drenar(silencioso)) return;
    marcaSync('trab','Sincronizando');
    const d = await api('leer');
    moldes    = d.moldes    || [];
    piezas    = d.piezas    || [];
    productos = d.productos || [];
    ventas    = d.ventas    || [];
    await cache.set('moldes', moldes);
    await cache.set('piezas', piezas);
    await cache.set('productos', productos);
    await cache.set('ventas', ventas);
    marcaSync('ok','Al día');
    if (!silencioso) brindis(pendientes ? `${pendientes} cambio(s) enviados a la hoja.` : 'Inventario al día.');
    pintar();
  } catch(err){
    marcaSync('mal','Sin conexión');
    if (!silencioso) brindis('No se pudo conectar: ' + err.message);
  } finally { sincronizando = false; }
}

async function iniciar(){
  config    = (await cache.get('config'))    || {url:'', clave:''};
  moldes    = (await cache.get('moldes'))    || [];
  piezas    = (await cache.get('piezas'))    || [];
  productos = (await cache.get('productos')) || [];
  ventas    = (await cache.get('ventas'))    || [];
  cola      = (await cache.get('cola'))      || [];
  listo = true;
  marcaSync('', config.url ? 'Tocar para sincronizar' : 'Sin conectar');
  pintar();
  if (config.url) sincronizar(true);
}

/* ══════════ respuesta para el cliente ══════════ */
function precios(){
  return productos.filter(p=>Number(p.precio) > 0)
    .map(p=>`${p.nombre}: ${pesos(p.precio)}`).join('. ');
}

function redactar(p){
  const m = moldeDe(p);
  const e = estado(p);
  const lista = precios();
  const tarifa = lista ? ` ${lista}.` : '';
  if (e === 'listo'){
    const n = Number(p.existencia)||0;
    return `¡Hola! Sí 🙌 Tengo ${p.nombre}: ${n} ${n===1?'unidad lista':'unidades listas'} para entrega inmediata.${tarifa} ¿Cuántas necesitas?`;
  }
  if (e === 'encargo'){
    const d = Number(m.dias)||0;
    const plazo = d>0 ? `te la elaboro en ${d} ${d===1?'día':'días'}.` : 'te la elaboro sobre pedido.';
    return `¡Hola! Sí manejo ${p.nombre}. En este momento no tengo unidades listas, pero ${plazo}${tarifa} ¿Cuántas necesitas y para qué fecha?`;
  }
  return `Por ahora no tengo disponible ${p.nombre || 'esa figura'}. Con gusto te muestro otras que sí manejo 🙂`;
}

async function copiar(texto, boton){
  let ok = false;
  try { await navigator.clipboard.writeText(texto); ok = true; } catch(e){}
  if (!ok){
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    app.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove();
  }
  if (ok && boton){
    const antes = boton.textContent;
    boton.textContent = '✓ Copiado'; boton.classList.add('ok');
    setTimeout(()=>{ boton.textContent = antes; boton.classList.remove('ok'); }, 1900);
  } else if (!ok) brindis('Seleccione el texto y cópielo manualmente.');
}

/* ══════════ búsqueda ══════════ */
function partes(q){
  const t = limpio(q).split(/\s+/).filter(p=>p && !VACIAS.has(p) && !['algo','tienes','tiene'].includes(p));
  return t.length ? t : limpio(q).split(/\s+/).filter(Boolean);
}

/* La pieza se busca por lo suyo. Si se incluyeran las palabras del molde,
   buscar "abeja" devolvería también Miel y Flor por ser del mismo molde. */
function coincidePieza(p, ps){
  if (!ps.length) return true;
  const bolsa = limpio([p.nombre, p.claves, moldeDe(p).codigo].join(' '));
  return ps.every(x=>bolsa.includes(x));
}

function coincideMolde(m, ps){
  if (!ps.length) return true;
  const suyas = piezasDe(m.id).map(p=>p.nombre + ' ' + p.claves).join(' ');
  const bolsa = limpio([m.nombre, m.claves, m.codigo, m.categoria, m.notas, m.ubicacion, suyas].join(' '));
  return ps.every(x=>bolsa.includes(x));
}

function visibles(){
  const ps = partes(consulta);
  if (filtro === 'moldes'){
    return moldes.filter(m=>coincideMolde(m, ps))
      .sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es'));
  }

  const filtrar = lista => lista.filter(p=>{
    if (filtro === 'listo') return estado(p) === 'listo';
    if (filtro === 'sinnombre') return sinNombre(p);
    if (filtro === 'bajo') return estado(p)==='listo' && Number(p.existencia) <= umbral(p);
    return true;
  });

  let res = filtrar(piezas.filter(p=>coincidePieza(p, ps)));

  /* Nada por nombre de pieza: quizá buscó el molde ("granja", "ABE-01").
     Se muestran entonces las piezas de los moldes que sí coinciden. */
  if (!res.length && ps.length){
    const ids = new Set(moldes.filter(m=>coincideMolde(m, ps)).map(m=>m.id));
    res = filtrar(piezas.filter(p=>ids.has(p.idMolde)));
  }

  return res.sort((a,b)=>{
    const o = {listo:0, encargo:1, vacio:2, no:3};
    return (o[estado(a)]-o[estado(b)]) || (a.nombre||'').localeCompare(b.nombre||'','es');
  });
}

/* ══════════ pintado ══════════ */
/* La dirección de "miniatura" de Drive devuelve a veces un recorte centrado:
   por eso las planchas salían cortadas. Esta otra respeta la foto completa.
   Se traduce aquí, en la app, para que sirva también con las fotos ya guardadas. */
function urlFoto(foto, ancho){
  if (!foto) return '';
  const id = (String(foto).match(/[?&]id=([A-Za-z0-9_-]+)/) || [])[1];
  return id ? `https://lh3.googleusercontent.com/d/${id}=w${ancho}` : String(foto);
}

function miniatura(m, zoom){
  return `<span class="foto"${zoom && m.foto ? ` data-zoom="${esc(m.id)}" role="button" tabindex="0" aria-label="Ver la foto en grande"` : ''}>${m.foto
    ? `<img src="${esc(urlFoto(m.foto, 400))}" alt="" loading="lazy" onerror="this.src='${esc(m.foto)}'" style="transform:rotate(${Number(m.giro)||0}deg)">`
    : 'SIN FOTO'}</span>`;
}

/* Visor a pantalla completa: pellizque para acercar, doble toque para alternar,
   arrastre para moverse. La lista de piezas queda debajo para poder numerarlas
   mirando la plancha en grande. */
function abrirVisor(idMolde){
  const m = moldes.find(x=>x.id===idMolde);
  if (!m || !m.foto) return;
  /* La dirección de "miniatura" de Drive devuelve a veces un recorte centrado:
     por eso la plancha aparecía cortada por abajo. Esta otra respeta la foto
     completa. Si fallara, se cae de vuelta a la miniatura. */
  const grande = urlFoto(m.foto, 1600);
  const suyas = piezasDe(m.id);

  const v = document.createElement('div');
  v.className = 'visor';
  v.innerHTML = `
    <div class="visor-top">
      <div style="min-width:0">
        <h3></h3>
        <div class="cod" style="font-family:var(--dato);font-size:10.5px;letter-spacing:.08em"></div>
      </div>
      <button class="visor-x" aria-label="Cerrar">×</button>
    </div>
    <div class="visor-lienzo"><img alt=""></div>
    <div class="visor-bar">
      <button data-a="menos" aria-label="Alejar">−</button>
      <button data-a="ajustar">Ajustar</button>
      <button data-a="llenar">Llenar</button>
      <button data-a="mas" aria-label="Acercar">+</button>
      <button data-a="izq" aria-label="Girar a la izquierda">&#8634;</button>
      <button data-a="der" aria-label="Girar a la derecha">&#8635;</button>
    </div>
    <div class="visor-guardar" id="visor-guardar" hidden>
      <button class="btn btn-verde" id="v-guardar">Guardar este giro</button>
    </div>
    <div class="visor-guardar">
      <button class="btn" id="v-molde"
              style="background:transparent;color:var(--yeso-alto);border:1px solid rgba(232,232,227,.35)">
        Abrir el molde para editarlo</button>
    </div>
    <div class="visor-tip">Doble toque alterna entre ver todo y llenar la pantalla · pellizque para acercar</div>
    <div class="visor-piezas"></div>`;

  v.querySelector('h3').textContent = m.nombre || 'Molde sin nombre';
  v.querySelector('.cod').textContent = (m.codigo || '') + (suyas.length ? ` · ${suyas.length} piezas` : '');

  const cajaP = v.querySelector('.visor-piezas');
  suyas.forEach(p=>{
    const b = document.createElement('button');
    b.className = 'vp' + (sinNombre(p) ? ' sin' : '');
    b.innerHTML = `<b>${esc(p.numero||'?')}</b><span></span>`;
    b.querySelector('span').textContent = sinNombre(p) ? 'Sin nombre' : p.nombre;
    b.addEventListener('click', ()=>{ v.remove(); abrirPieza(p.id); });
    cajaP.appendChild(b);
  });

  const img = v.querySelector('img');
  const lienzo = v.querySelector('.visor-lienzo');
  /* Si la foto deja mucho espacio muerto —pasa cuando la tomaron con otro
     celular, en otra orientación— se abre llenando la pantalla en vez de
     dejarla pequeña en el centro. Un toque en "Ajustar" la muestra completa. */
  img.addEventListener('error', ()=>{
    if (img.src !== m.foto) img.src = m.foto;
  }, {once:true});

  img.addEventListener('load', ()=>{
    const { r, w, h, base } = medidas();
    if (!r.width || !w) return;
    aplicar();
    const vertical = giro === 90 || giro === 270;
    const aprovecha = ((vertical ? h : w) * base * (vertical ? w : h) * base) / (r.width * r.height);
    /* Llenar recorta lo que sobresale. Solo vale la pena cuando el recorte es
       leve; en una pantalla ancha con foto vertical sería brutal. */
    if (aprovecha < 0.62 && escalaLlenar() <= 1.8) llenar();
  }, {once:true});
  img.src = grande;

  let escala = 1, x = 0, y = 0, giro = Number(m.giro) || 0;
  const giroOriginal = giro;

  /* Al girar 90° se intercambian ancho y alto: una foto apaisada girada se
     sale del recuadro y se corta. `base` es el ajuste que la vuelve a encajar.
     Se calcula con el tamaño natural de la imagen, no con el que ya tiene
     aplicado el propio giro, para no morderse la cola. */
  const medidas = ()=>{
    const r = lienzo.getBoundingClientRect();
    const nw = img.naturalWidth || 0, nh = img.naturalHeight || 0;
    if (!r.width || !nw || !nh) return {r:r, w:0, h:0, base:1};
    const encaje = Math.min(1, r.width/nw, r.height/nh);   // lo que hace object-fit
    const w = nw * encaje, h = nh * encaje;
    const vertical = giro === 90 || giro === 270;
    const base = vertical ? Math.min(r.width/h, r.height/w) : 1;
    return {r:r, w:w, h:h, base:base};
  };
  const aplicar = ()=>{
    const { base } = medidas();
    img.style.transform = `translate(${x}px, ${y}px) scale(${base * escala}) rotate(${giro}deg)`;
  };
  /* El margen se calcula sobre el tamaño real que ocupa la imagen, no sobre el
     lienzo: una foto vertical deja franjas laterales por las que no hay que
     poder arrastrar, y una ampliada sí debe recorrerse entera. */
  /* El margen se mide sobre lo que la foto ocupa de verdad en pantalla: una
     foto que cabe entera no debe poder arrastrarse; una ampliada sí, toda. */
  const limitar = () => {
    const { r, w, h, base } = medidas();
    const vertical = giro === 90 || giro === 270;
    const ancho = (vertical ? h : w) * base * escala;
    const alto  = (vertical ? w : h) * base * escala;
    const maxX = Math.max(0, (ancho - r.width) / 2);
    const maxY = Math.max(0, (alto - r.height) / 2);
    x = Math.max(-maxX, Math.min(maxX, x));
    y = Math.max(-maxY, Math.min(maxY, y));
  };
  const zoomA = n => { escala = Math.max(1, Math.min(8, n)); limitar(); aplicar(); };

  /* Cada foto llega con proporciones distintas según el celular que la tomó.
     "Ajustar" la muestra completa; "Llenar" la agranda hasta cubrir la pantalla
     usando el lado que le sobra. Se recalcula porque el giro intercambia lados. */
  const escalaLlenar = () => {
    const { r, w, h, base } = medidas();
    if (!w || !h) return 1;
    const vertical = giro === 90 || giro === 270;
    const ancho = (vertical ? h : w) * base;
    const alto  = (vertical ? w : h) * base;
    return Math.max(1, Math.min(8, Math.max(r.width / ancho, r.height / alto)));
  };

  const llenar = () => { x = 0; y = 0; zoomA(escalaLlenar()); };
  const ajustar = () => { escala = 1; x = 0; y = 0; aplicar(); };

  v.querySelector('.visor-x').addEventListener('click', ()=>v.remove());
  v.querySelector('.visor-bar').addEventListener('click', ev=>{
    const b = ev.target.closest('button'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'mas') zoomA(escala * 1.5);
    else if (a === 'menos') zoomA(escala / 1.5);
    else if (a === 'ajustar') ajustar();
    else if (a === 'llenar') llenar();
    else {
      giro = (giro + (a === 'izq' ? -90 : 90) + 360) % 360;
      ajustar();
      v.querySelector('#visor-guardar').hidden = (giro === giroOriginal);
    }
  });

  /* gestos */
  const punteros = new Map();
  let dist0 = 0, escala0 = 1, ultTap = 0, arrastreX = 0, arrastreY = 0;

  const separacion = ()=>{
    const [a, b] = [...punteros.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  };

  lienzo.addEventListener('pointerdown', ev=>{
    lienzo.setPointerCapture(ev.pointerId);
    punteros.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    if (punteros.size === 2){ dist0 = separacion(); escala0 = escala; }
    else { arrastreX = ev.clientX - x; arrastreY = ev.clientY - y; }
  });

  lienzo.addEventListener('pointermove', ev=>{
    if (!punteros.has(ev.pointerId)) return;
    punteros.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    if (punteros.size === 2 && dist0){
      zoomA(escala0 * (separacion() / dist0));
    } else if (punteros.size === 1){
      x = ev.clientX - arrastreX; y = ev.clientY - arrastreY;
      limitar(); aplicar();
    }
  });

  const soltar = ev=>{
    punteros.delete(ev.pointerId);
    if (punteros.size < 2) dist0 = 0;
  };
  lienzo.addEventListener('pointerup', soltar);
  lienzo.addEventListener('pointercancel', soltar);

  lienzo.addEventListener('click', ()=>{
    const ahora = Date.now();
    if (ahora - ultTap < 320){ escala > 1.02 ? ajustar() : llenar(); ultTap = 0; }
    else ultTap = ahora;
  });

  lienzo.addEventListener('wheel', ev=>{
    ev.preventDefault();
    zoomA(escala * (ev.deltaY < 0 ? 1.15 : 1/1.15));
  }, {passive:false});

  /* Girar aquí debe poder guardarse: es donde se ve la foto grande y donde
     uno se da cuenta de que está acostada. */
  v.querySelector('#v-guardar').addEventListener('click', async ev=>{
    ev.currentTarget.disabled = true;
    const i = moldes.findIndex(x=>x.id===m.id);
    if (i < 0) return;
    moldes[i] = Object.assign({}, moldes[i], {giro:giro});
    await guardarLocal();
    v.remove();
    await encolar('guardarMolde', moldes[i]);
    brindis('Giro guardado.');
  });

  v.querySelector('#v-molde').addEventListener('click', ()=>{ v.remove(); abrirMolde(m.id); });

  const conEsc = ev=>{ if (ev.key === 'Escape'){ v.remove(); document.removeEventListener('keydown', conEsc); } };
  document.addEventListener('keydown', conEsc);

  app.appendChild(v);
  aplicar();
}

      b.innerHTML = `
        <div class="lienzo">${x.foto
          ? `<img src="${esc(urlFoto(x.foto, 500))}" alt="" loading="lazy" onerror="this.src='${esc(x.foto)}'" style="transform:rotate(${Number(x.giro)||0}deg)">`
          : '<span>SIN FOTO</span>'}</div>
        <span class="cinta${roto ? ' mal' : (f ? ' aviso-falta' : '')}">${
          roto ? (x.estado==='danado' ? 'Dañado' : 'No lo tengo') : (f ? `Faltan ${f}` : `${n} piezas`)}</span>
        <div class="txt">
          <div class="cod">${esc(x.codigo||'—')}${x.ubicacion?' · '+esc(x.ubicacion):''}</div>
          <div class="nom"></div>
        </div>`;
      b.querySelector('.nom').textContent = x.nombre || 'Sin nombre';
      b.addEventListener('click', ()=>abrirMolde(x.id));
      rejilla.appendChild(b);
      return;
    }
    {
      const m = moldeDe(x);
      b.className = 'ficha' + (pend.has(String(x.id)) ? ' pend' : '');
      b.innerHTML = `${miniatura(m, true)}
        <div class="info">
          <div class="cod">${esc(m.codigo||'—')} · pieza ${esc(x.numero||'?')}${m.nombre?' · '+esc(m.nombre):''}</div>
          <div class="nom${sinNombre(x)?' gris':''}"></div>
          <div class="pie"><span class="sello ${estado(x)}">${etiqueta(x)}</span></div>
        </div>
        <div class="cant"><b>${Number(x.existencia)||0}</b><span>EN BODEGA</span></div>`;
      b.querySelector('.nom').textContent = x.nombre || 'Sin nombre — por completar';
      b.addEventListener('click', ()=>abrirPieza(x.id));
    }
    lista.appendChild(b);
  });
}

/* ══════════ modales ══════════ */
function cerrar(){ document.querySelectorAll('.capa').forEach(c=>c.remove()); }

function abrir(html){
  cerrar();
  const capa = document.createElement('div');
  capa.className = 'capa';
  capa.innerHTML = `<div class="hoja">${html}</div>`;
  capa.addEventListener('click', ev=>{ if (ev.target===capa) cerrar(); });
  app.appendChild(capa);
  const x = capa.querySelector('.cerrar');
  if (x) x.addEventListener('click', cerrar);
  return capa;
}

let contador = 0;
const nuevoId = pre => pre + Date.now() + '-' + (contador++);

/* Número corrido. No se deriva del nombre: un código así envejece mal
   y choca entre moldes parecidos. */
function codigoLibre(){
  let max = 0;
  moldes.forEach(x=>{
    const m = String(x.codigo||'').match(/^M-(\d+)$/);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  const n = max + 1;
  return 'M-' + (n < 1000 ? String(n).padStart(3,'0') : n);
}

function moldeNuevo(){
  return {id:nuevoId('m'), codigo:'', nombre:'', categoria:'', claves:'', medidas:'', cavidades:0,
          dias:2, estado:'bueno', ubicacion:'', notas:'', foto:'', giro:0};
}

function piezaNueva(idMolde, numero){
  return {id:nuevoId('z'), idMolde:idMolde, numero:numero, nombre:'', claves:'', existencia:0, minimo:3};
}

async function guardarLocal(){
  await cache.set('moldes', moldes);
  await cache.set('piezas', piezas);
  await cache.set('productos', productos);
  pintar();
}

/* ══════════ molde ══════════ */
function abrirMolde(id){
  const nuevo = !id;
  const m = nuevo ? moldeNuevo() : Object.assign({}, moldes.find(x=>x.id===id));
  const suyas = nuevo ? [] : piezasDe(m.id);
  const f = nuevo ? 0 : faltan(m);

  const capa = abrir(`
    <div class="hoja-top"><h2>${nuevo?'Nuevo molde':'Molde'}</h2><button class="cerrar" aria-label="Cerrar">×</button></div>

    <div class="foto-caja">
      <div class="foto-prev" id="prev">${m.foto ? '<img alt="">' : 'SIN FOTO'}</div>
      <div style="flex:1">
        <button class="btn btn-borde" id="btnFoto" style="width:100%">Tomar o subir foto</button>
        <div class="girar">
          <button type="button" id="girarI" aria-label="Girar a la izquierda">&#8634;</button>
          <button type="button" id="girarD" aria-label="Girar a la derecha">&#8635;</button>
        </div>
        <input type="file" id="archFoto" accept="image/*" style="display:none">

      </div>

    <div class="campo"><label for="m-nom">Nombre del molde</label>
      <input id="m-nom" placeholder="Abeja Miel Flor">
      <span class="pista">Cómo llama usted a la plancha completa. Las piezas se nombran abajo.</span></div>

    <div class="dos">
      <div class="campo"><label for="m-cod">Código</label><input id="m-cod" placeholder="ABE-01"></div>
      <div class="campo"><label for="m-cat">Categoría</label>
        <input id="m-cat" placeholder="Animales" list="cats"><datalist id="cats"></datalist></div>
    </div>

    <div class="dos">
      <div class="campo"><label for="m-cav">Cavidades del molde</label>
        <input id="m-cav" type="number" min="0" inputmode="numeric">
        <span class="pista">Cuántas figuras trae la plancha en total.</span></div>
      <div class="campo"><label for="m-dia">Días para producir</label>
        <input id="m-dia" type="number" min="0" inputmode="numeric"></div>
    </div>

    ${f ? `<div class="aviso">Este molde declara <b>${Number(m.cavidades)}</b> cavidades y solo tiene
            <b>${suyas.length}</b> piezas registradas. Faltan <b>${f}</b> por nombrar.</div>` : ''}

    ${nuevo ? '<span class="pista" style="margin:0 0 16px">Guarde el molde y después agregue sus piezas.</span>' : `
    <div class="campo"><label>Piezas de este molde</label>
      <div class="lista-piezas" id="piezas"></div>
      <button class="btn btn-borde" id="masPieza" style="width:100%;margin-top:9px">+ Agregar pieza</button>
      <span class="pista">El número corresponde a la posición en la foto. Toque una pieza para nombrarla o contarla.</span></div>`}

    <div class="dos">
      <div class="campo"><label for="m-est">Estado del molde</label>
        <select id="m-est">
          <option value="bueno">Bueno — puedo producir</option>
          <option value="danado">Dañado — no puedo producir</option>
          <option value="sinmolde">Ya no lo tengo</option>

  const h = capa.querySelector('.hoja');
  const campos = {'#m-nom':'nombre','#m-cod':'codigo','#m-cat':'categoria','#m-cav':'cavidades',

                  '#m-cla':'claves','#m-not':'notas'};
  Object.entries(campos).forEach(([s,k])=>{ h.querySelector(s).value = m[k] ?? ''; });

  h.querySelector('#cats').innerHTML =
    [...new Set(moldes.map(x=>x.categoria).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('');

  /* foto y giro */
  const prev = h.querySelector('#prev');
  let fotoBase64 = null, quitarFoto = false, giro = Number(m.giro) || 0;

  const pintarPrev = fuente => {
    if (!fuente){ prev.innerHTML = 'SIN FOTO'; return; }
    let img = prev.querySelector('img');
    if (!img){ prev.innerHTML = ''; img = document.createElement('img'); img.alt = ''; prev.appendChild(img); }
    img.src = fuente;
    img.style.transform = `rotate(${giro}deg)`;
  };
  pintarPrev(urlFoto(m.foto, 600));

  const rotar = g => {
    const img = prev.querySelector('img');
    if (!img){ brindis('Primero suba una foto.'); return; }
    giro = (giro + g + 360) % 360;
    img.style.transform = `rotate(${giro}deg)`;
  };

  h.querySelector('#girarD').addEventListener('click', ()=>rotar(90));

  prev.style.cursor = 'zoom-in';
  prev.addEventListener('click', ()=>{
    if (prev.querySelector('img') && !fotoBase64) abrirVisor(m.id);
  });

  h.querySelector('#btnFoto').addEventListener('click', ()=>h.querySelector('#archFoto').click());
  h.querySelector('#archFoto').addEventListener('change', ev=>{
    const arch = ev.target.files && ev.target.files[0];
    if (!arch) return;
    comprimir(arch, 700, 0.72).then(d=>{
      fotoBase64 = d; quitarFoto = false;
      pintarPrev(d);
      h.querySelector('#quitaFoto').style.display = '';
    }).catch(()=>brindis('No se pudo leer esa imagen.'));
  });

  h.querySelector('#quitaFoto').addEventListener('click', ()=>{
    fotoBase64 = null; quitarFoto = true; giro = 0;
    prev.innerHTML = 'SIN FOTO';
    h.querySelector('#quitaFoto').style.display = 'none';
  });

  /* piezas */
  const cajaPiezas = h.querySelector('#piezas');
  if (cajaPiezas){
    const pintarPiezas = ()=>{
      const actuales = piezasDe(m.id);
      cajaPiezas.innerHTML = '';
      if (!actuales.length){
        cajaPiezas.innerHTML = '<div style="padding:14px;color:var(--tiza);font-size:13.5px">Sin piezas registradas.</div>';
      }
      actuales.forEach(p=>{
        const b = document.createElement('button');
        b.className = 'pieza';
        b.innerHTML = `<span class="n${sinNombre(p)?' sin':''}">${esc(p.numero||'?')}</span>
                       <span class="t"></span>
                       <span class="e">${Number(p.existencia)||0}</span>`;
        const t = b.querySelector('.t');
        if (sinNombre(p)) t.innerHTML = '<i>Sin nombre — por completar</i>';
        else t.textContent = p.nombre;
        b.addEventListener('click', ()=>abrirPieza(p.id));
        cajaPiezas.appendChild(b);
      });
    };
    pintarPiezas();

    h.querySelector('#masPieza').addEventListener('click', async ()=>{
      const actuales = piezasDe(m.id);
      const num = actuales.reduce((s,p)=>Math.max(s, Number(p.numero)||0), 0) + 1;
      const nueva = piezaNueva(m.id, num);
      piezas.push(nueva);
      await guardarLocal();
      await encolar('guardarPieza', nueva);
      abrirPieza(nueva.id);
    });
  }

  h.querySelector('#guardar').addEventListener('click', async ()=>{
    Object.entries(campos).forEach(([s,k])=>{ m[k] = h.querySelector(s).value; });
    if (!(m.nombre||'').trim()){ brindis('Escriba el nombre del molde.'); return; }
    ['cavidades','dias'].forEach(k=>{ m[k] = Number(m[k])||0; });
    m.giro = giro;
    if (!m.codigo) m.codigo = codigoLibre();
    if (quitarFoto) m.foto = '';

    const i = moldes.findIndex(x=>x.id===m.id);
    if (i>=0) moldes[i] = m; else moldes.push(m);
    await guardarLocal();
    cerrar();

    const extra = fotoBase64 ? {fotoBase64:fotoBase64} : (quitarFoto ? {quitarFoto:true} : null);
    const ok = await encolar('guardarMolde', Object.assign({}, m, extra||{}));
    if (ok && fotoBase64) await sincronizar(true);
    brindis(nuevo ? 'Molde registrado.' : 'Cambios guardados.');
  });

  const bb = h.querySelector('#borrar');
  if (bb) bb.addEventListener('click', ()=>{
    const c2 = abrir(`<div class="hoja-top"><h2>¿Eliminar este molde?</h2><button class="cerrar">×</button></div>
      <p style="font-size:14.5px;line-height:1.6;color:var(--pizarra-2);margin:0">
        Se borra el molde y <b>todas sus piezas</b>, junto con la foto. No se puede deshacer.</p>
      <div class="acciones"><button class="btn btn-borde" id="no">Cancelar</button>
      <button class="btn btn-peligro" id="si">Sí, eliminar</button></div>`);
    c2.querySelector('#no').addEventListener('click', cerrar);
    c2.querySelector('#si').addEventListener('click', async ()=>{
      moldes = moldes.filter(x=>x.id!==m.id);
      piezas = piezas.filter(p=>p.idMolde!==m.id);
      await guardarLocal();
      cerrar();
      await encolar('eliminarMolde', {id:m.id});
      brindis('Molde eliminado.');
    });
  });
}

      <textarea id="p-cla" placeholder="abeja, abejita, abejas"></textarea>

    <div class="campo"><label>Piezas listas en bodega</label>
      <div class="contador">
        <button type="button" id="menos" aria-label="Restar una">−</button>
        <input id="p-exi" type="number" min="0" inputmode="numeric">
        <button type="button" id="mas" aria-label="Sumar una">+</button>
      </div></div>

    <div class="dos">
      <div class="campo"><label for="p-num">Número en el molde</label>
        <input id="p-num" type="number" min="1" inputmode="numeric"></div>
      <div class="campo"><label for="p-min">Avisar cuando queden</label>
        <input id="p-min" type="number" min="0" inputmode="numeric"></div>
    </div>

    <div class="acciones">
      <button class="btn btn-primario" id="guardar">Guardar</button>
      <button class="btn btn-peligro" id="borrar">Eliminar</button>
    </div>`);

  const h = capa.querySelector('.hoja');
  h.querySelector('#verMolde .nom').textContent = m.nombre || 'Molde sin nombre';
  h.querySelector('#verMolde').addEventListener('click', ev=>{
    const z = ev.target.closest('[data-zoom]');
    if (z){ ev.stopPropagation(); abrirVisor(m.id); return; }
    abrirMolde(m.id);
  });

  const campos = {'#p-nom':'nombre','#p-cla':'claves','#p-exi':'existencia','#p-num':'numero','#p-min':'minimo'};
  Object.entries(campos).forEach(([s,k])=>{ h.querySelector(s).value = p[k] ?? ''; });

  const nom = h.querySelector('#p-nom'), cla = h.querySelector('#p-cla');
  let clavesTocadas = !!String(p.claves||'').trim();
  cla.addEventListener('input', ()=>{ clavesTocadas = true; });
  nom.addEventListener('input', ()=>{ if (!clavesTocadas) cla.value = clavesDe(nom.value); });

  const exi = h.querySelector('#p-exi');
  h.querySelector('#mas').addEventListener('click', ()=>{ exi.value = (Number(exi.value)||0)+1; });
  h.querySelector('#menos').addEventListener('click', ()=>{ exi.value = Math.max(0,(Number(exi.value)||0)-1); });

  h.querySelector('#guardar').addEventListener('click', async ()=>{
    Object.entries(campos).forEach(([s,k])=>{ p[k] = h.querySelector(s).value; });
    ['existencia','numero','minimo'].forEach(k=>{ p[k] = Number(p[k])||0; });
    if (!String(p.claves||'').trim() && p.nombre) p.claves = clavesDe(p.nombre);

    const i = piezas.findIndex(x=>x.id===p.id);
    if (i>=0) piezas[i] = p; else piezas.push(p);
    await guardarLocal();
    cerrar();
    await encolar('guardarPieza', p);
    brindis('Pieza guardada.');
  });

  h.querySelector('#borrar').addEventListener('click', async ()=>{
    piezas = piezas.filter(x=>x.id!==p.id);
    await guardarLocal();
    cerrar();
    await encolar('eliminarPieza', {id:p.id});
    brindis('Pieza eliminada.');
  });
}

function comprimir(archivo, max, calidad){
  return new Promise((res, rej)=>{
    const lector = new FileReader();
    lector.onerror = rej;
    lector.onload = ()=>{
      const img = new Image();
      img.onerror = rej;
      img.onload = ()=>{
        const e = Math.min(1, max/Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*e); cv.height = Math.round(img.height*e);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', calidad));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

/* ══════════ venta ══════════ */
function abrirVenta(){
  if (!productos.length){ brindis('Primero registre sus productos y precios.'); return; }
  const escogidas = [];

  const capa = abrir(`
    <div class="hoja-top"><h2>Registrar venta</h2><button class="cerrar">×</button></div>

    <div class="campo"><label for="v-pro">Qué vendió</label>
      <select id="v-pro">${productos.map(p=>`<option value="${esc(p.id)}">${esc(p.nombre)} · ${pesos(p.precio)}</option>`).join('')}</select>

      <input id="v-buscar" placeholder="Escriba para buscar una pieza" autocomplete="off">

      <div class="campo"><label for="v-tot">Total cobrado</label>
        <input id="v-tot" type="number" min="0" inputmode="numeric"></div>
      <div class="campo"><label for="v-cli">Cliente (opcional)</label><input id="v-cli"></div>
    </div>
    <div class="campo"><label for="v-not">Nota (opcional)</label><input id="v-not"></div>

    <div class="acciones"><button class="btn btn-verde" id="v-ok">Registrar y descontar</button></div>`);

  const h = capa.querySelector('.hoja');
  const sel = h.querySelector('#v-pro'), hint = h.querySelector('#v-hint'), tot = h.querySelector('#v-tot');

  const productoActual = ()=>productos.find(x=>x.id === sel.value) || productos[0];
  const refrescarProducto = ()=>{
    const pr = productoActual();
    tot.value = Number(pr.precio)||0;
    const n = Number(pr.piezas)||0;
    hint.textContent = n ? `Este producto lleva ${n} piezas.` : 'La cantidad de piezas es libre.';
  };
  sel.addEventListener('change', refrescarProducto);
  refrescarProducto();

  const pintarSel = ()=>{
    const caja = h.querySelector('#v-sel');
    caja.innerHTML = escogidas.length ? '' :
      '<div style="padding:13px;color:var(--tiza);font-size:13.5px">Ninguna todavía.</div>';
    escogidas.forEach((e, i)=>{
      const fila = document.createElement('div');
      fila.className = 'pieza';
      fila.innerHTML = `<span class="n">${esc(e.cantidad)}</span><span class="t"></span>
                        <button class="e" style="border:none;background:none;color:var(--alerta);font-size:18px">×</button>`;
      fila.querySelector('.t').textContent = e.nombre;
      fila.querySelector('button').addEventListener('click', ()=>{ escogidas.splice(i,1); pintarSel(); });
      caja.appendChild(fila);
    });
  };
  pintarSel();

  const buscar = h.querySelector('#v-buscar'), res = h.querySelector('#v-res');
  buscar.addEventListener('input', ()=>{
    const ps = partes(buscar.value);
    res.innerHTML = '';
    if (!ps.length) return;
    piezas.filter(p=>!sinNombre(p) && coincidePieza(p, ps)).slice(0, 12).forEach(p=>{
      const m = moldeDe(p);
      const b = document.createElement('button');
      b.className = 'pieza';
      b.style.background = '#fff';
      b.innerHTML = `<span class="n">${esc(p.numero||'?')}</span><span class="t"></span>
                     <span class="e">${Number(p.existencia)||0}</span>`;
      b.querySelector('.t').textContent = `${p.nombre} · ${m.codigo||''}`;
      b.addEventListener('click', ()=>{
        const ya = escogidas.find(e=>e.id===p.id);
        if (ya) ya.cantidad++;
        else escogidas.push({id:p.id, nombre:p.nombre, cantidad:1});
        buscar.value = ''; res.innerHTML = '';
        pintarSel();
      });
      res.appendChild(b);
    });
  });

  h.querySelector('#v-ok').addEventListener('click', async ev=>{
    if (!escogidas.length){ brindis('Escoja al menos una pieza.'); return; }
    const excedidas = escogidas.filter(e=>{
      const p = piezas.find(x=>x.id===e.id);
      return p && e.cantidad > (Number(p.existencia)||0);
    });
    if (excedidas.length){
      brindis(`No hay suficientes de ${excedidas[0].nombre} en bodega.`);
      return;
    }
    ev.currentTarget.disabled = true;
    const pr = productoActual();
    const venta = {
      idProducto: pr.id, producto: pr.nombre,
      precio: Number(pr.precio)||0,
      total: Number(tot.value)||Number(pr.precio)||0,
      piezas: escogidas.map(e=>({id:e.id, nombre:e.nombre, cantidad:e.cantidad})),
      cliente: h.querySelector('#v-cli').value,
      nota: h.querySelector('#v-not').value,
    };

    escogidas.forEach(e=>{
      const p = piezas.find(x=>x.id===e.id);
      if (p) p.existencia = Math.max(0, (Number(p.existencia)||0) - e.cantidad);
    });
    ventas.push(Object.assign({fecha:new Date().toISOString(), detalle:''}, venta));
    await cache.set('ventas', ventas);
    await guardarLocal();
    cerrar();
    const enviado = await encolar('venta', venta);
    brindis(enviado || !config.url ? 'Venta registrada.' : 'Venta guardada. Sube sola al reconectar.');
  });
}

/* ══════════ productos ══════════ */
function abrirProductos(){
  const capa = abrir(`
    <div class="hoja-top"><h2>Productos y precios</h2><button class="cerrar">×</button></div>
    <span class="pista" style="margin:0 0 14px">Aquí vive el precio. Las piezas no tienen precio propio.</span>
    <div id="pr-lista"></div>
    <button class="btn btn-borde" id="pr-nuevo" style="width:100%;margin-top:12px">+ Nuevo producto</button>`);

  const h = capa.querySelector('.hoja');

  const pintarLista = ()=>{
    const caja = h.querySelector('#pr-lista');
    caja.innerHTML = '';
    if (!productos.length){
      caja.innerHTML = '<span class="pista">Sin productos todavía.</span>';
    }
    productos.forEach(pr=>{
      const b = document.createElement('button');
      b.className = 'ficha';
      b.innerHTML = `<div class="info">
          <div class="nom" style="font-size:15px"></div>
          <div class="cod">${Number(pr.piezas)>0 ? Number(pr.piezas)+' piezas' : 'Piezas libres'}</div>
        </div>
        <div class="cant" style="min-width:82px"><b style="font-size:18px">${pesos(pr.precio)}</b></div>`;
      b.querySelector('.nom').textContent = pr.nombre;
      b.addEventListener('click', ()=>editarProducto(pr.id));
      caja.appendChild(b);
    });
  };
  pintarLista();
  h.querySelector('#pr-nuevo').addEventListener('click', ()=>editarProducto(null));
}

function editarProducto(id){
  const nuevo = !id;
  const pr = nuevo
    ? {id:nuevoId('p'), nombre:'', precio:0, piezas:0, notas:''}
    : Object.assign({}, productos.find(x=>x.id===id));

  const capa = abrir(`
    <div class="hoja-top"><h2>${nuevo?'Nuevo producto':'Producto'}</h2><button class="cerrar">×</button></div>
    <div class="campo"><label for="q-nom">Nombre</label>
      <input id="q-nom" placeholder="Kit de 3 piezas"></div>
    <div class="dos">
      <div class="campo"><label for="q-pre">Precio</label>
        <input id="q-pre" type="number" min="0" inputmode="numeric"></div>
      <div class="campo"><label for="q-pie">Piezas que lleva</label>
        <input id="q-pie" type="number" min="0" inputmode="numeric">
        <span class="pista">Deje 0 si varía, como el kit de letras.</span></div>
    </div>
    <div class="campo"><label for="q-not">Nota</label><input id="q-not"></div>
    <div class="acciones">
      <button class="btn btn-primario" id="q-ok">Guardar</button>
      ${nuevo?'':'<button class="btn btn-peligro" id="q-del">Eliminar</button>'}
    </div>`);

  const h = capa.querySelector('.hoja');
  const campos = {'#q-nom':'nombre','#q-pre':'precio','#q-pie':'piezas','#q-not':'notas'};
  Object.entries(campos).forEach(([s,k])=>{ h.querySelector(s).value = pr[k] ?? ''; });

  h.querySelector('#q-ok').addEventListener('click', async ()=>{
    Object.entries(campos).forEach(([s,k])=>{ pr[k] = h.querySelector(s).value; });
    if (!(pr.nombre||'').trim()){ brindis('Escriba el nombre del producto.'); return; }
    ['precio','piezas'].forEach(k=>{ pr[k] = Number(pr[k])||0; });
    const i = productos.findIndex(x=>x.id===pr.id);
    if (i>=0) productos[i] = pr; else productos.push(pr);
    await guardarLocal();
    cerrar();
    await encolar('guardarProducto', pr);
    brindis('Producto guardado.');
  });

  const bd = h.querySelector('#q-del');
  if (bd) bd.addEventListener('click', async ()=>{
    productos = productos.filter(x=>x.id!==pr.id);
    await guardarLocal();
    cerrar();
    await encolar('eliminarProducto', {id:pr.id});
    brindis('Producto eliminado.');
  });
}

/* ══════════ reportes ══════════ */
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio',
                     'agosto','septiembre','octubre','noviembre','diciembre'];

function porMes(n){
  const mapa = new Map(), hoy = new Date();
  for (let i = n-1; i >= 0; i--){
    const d = new Date(hoy.getFullYear(), hoy.getMonth()-i, 1);
    const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    mapa.set(k, {etiqueta: MESES[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2), n:0, ingresos:0});
  }
  ventas.forEach(v=>{
    const d = new Date(v.fecha);
    if (isNaN(d)) return;
    const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const m = mapa.get(k);
    if (m){ m.n++; m.ingresos += Number(v.total)||0; }
  });
  return [...mapa.values()];
}

function estacionalidad(){
  const acum = MESES.map(()=>({n:0, ingresos:0, anios:new Set()}));
  ventas.forEach(v=>{
    const d = new Date(v.fecha);
    if (isNaN(d)) return;
    const a = acum[d.getMonth()];
    a.n++; a.ingresos += Number(v.total)||0; a.anios.add(d.getFullYear());
  });
  return acum.map((a,i)=>({mes:MESES_LARGO[i], n:a.n, ingresos:a.ingresos, anios:a.anios.size}));
}

function descargarCSV(nombre, filas){
  const c = v => {
    const s = String(v == null ? '' : v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const texto = '\uFEFF' + filas.map(f=>f.map(c).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], {type:'text/csv;charset=utf-8'}));
  a.download = nombre;
  a.click();
  URL.revokeObjectURL(a.href);
}

function csvInventario(){
  const filas = [['Molde','Codigo','Ubicacion','Estado molde','Pieza N','Pieza','Palabras de busqueda','En bodega','Avisar en']];
  moldes.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es')).forEach(m=>{
    const suyas = piezasDe(m.id);
    if (!suyas.length) filas.push([m.nombre, m.codigo, m.ubicacion, m.estado, '', '(sin piezas)', '', '', '']);
    suyas.forEach(p=>{
      filas.push([m.nombre, m.codigo, m.ubicacion, m.estado, p.numero,
                  p.nombre || '(sin nombre)', p.claves, Number(p.existencia)||0, umbral(p)]);
    });
  });
  descargarCSV(`inventario-${new Date().toISOString().slice(0,10)}.csv`, filas);
}

function csvVentas(){
  if (!ventas.length){ brindis('Todavía no hay ventas registradas.'); return; }
  const filas = [['Fecha','Ano','Mes','Producto','Precio','Total','Piezas','Cliente','Nota']];
  ventas.slice().sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).forEach(v=>{
    const d = new Date(v.fecha);
    filas.push([d.toISOString().slice(0,10), d.getFullYear(), MESES_LARGO[d.getMonth()],
                v.producto, Number(v.precio)||0, Number(v.total)||0, v.detalle||'', v.cliente||'', v.nota||'']);
  });
  descargarCSV(`ventas-${new Date().toISOString().slice(0,10)}.csv`, filas);
}

function imprimirReporte(){
  const meses = porMes(12);
  const est = estacionalidad().filter(m=>m.n>0).sort((a,b)=>b.n-a.n);
  const enBodega = piezas.filter(p=>estado(p)==='listo').reduce((s,p)=>s+(Number(p.existencia)||0),0);
  const bajas = piezas.filter(p=>estado(p)==='listo' && Number(p.existencia) <= umbral(p));
  const pendientes = piezas.filter(sinNombre);
  const incompletos = moldes.filter(m=>faltan(m) > 0);
  const hoy = new Date();

  const tabla = (cab, filas) => filas.length
    ? `<table><thead><tr>${cab.map((c,i)=>`<th${i?' class="num"':''}>${c}</th>`).join('')}</tr></thead>
       <tbody>${filas.map(f=>`<tr>${f.map((c,i)=>`<td${i?' class="num"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`
    : '<p style="font-size:9.5pt;color:#666">Sin datos todavía.</p>';

  $('#impresion').innerHTML = `
    <h1>Filemón · Reporte de inventario y ventas</h1>
    <div style="font-size:9pt;color:#555">Generado el ${hoy.getDate()} de ${MESES_LARGO[hoy.getMonth()]} de ${hoy.getFullYear()}</div>

    <h2>Resumen</h2>
    ${tabla(['Indicador','Valor'], [
      ['Moldes registrados', moldes.length],
      ['Piezas distintas', piezas.length],
      ['Piezas en bodega', enBodega],
      ['Piezas sin nombre', pendientes.length],
      ['Moldes con piezas por registrar', incompletos.length],
      ['Moldes dañados', moldes.filter(m=>m.estado==='danado').length],
      ['Ventas registradas', ventas.length],
    ])}

    <h2>Ventas mes a mes (últimos 12 meses)</h2>
    ${tabla(['Mes','Ventas','Ingresos'], meses.map(m=>[m.etiqueta, m.n, pesos(m.ingresos)]))}

    <h2>Meses fuertes</h2>
    ${est.length
      ? tabla(['Mes','Ventas','Ingresos','Años con datos'], est.map(m=>[m.mes, m.n, pesos(m.ingresos), m.anios]))
        + `<p style="font-size:8.5pt;color:#666;margin-top:5pt">${est.some(m=>m.anios>1)
            ? 'Con más de un año de datos, esta tabla ya indica temporada.'
            : 'Todavía hay menos de un año de historia: muestra lo vendido, no una temporada confirmada.'}</p>`
      : '<p style="font-size:9.5pt;color:#666">Se necesita al menos un año de ventas para hablar de temporadas.</p>'}

    <h2>Piezas por reponer</h2>
    ${tabla(['Pieza','Molde','En bodega','Avisar en'],
      bajas.map(p=>[p.nombre, (moldeDe(p).codigo||'') + ' · ' + p.numero, Number(p.existencia)||0, umbral(p)]))}

    <h2>Moldes con piezas sin registrar</h2>
    ${tabla(['Molde','Código','Cavidades','Registradas'],
      incompletos.map(m=>[m.nombre, m.codigo, Number(m.cavidades)||0, piezasDe(m.id).length]))}

    <div class="pie">Documento interno de Filemón.</div>`;

  cerrar();
  setTimeout(()=>window.print(), 120);
}

function abrirReportes(){
  const meses = porMes(12);
  const max = Math.max(1, ...meses.map(m=>m.n));
  const pico = Math.max(...meses.map(m=>m.n));

  const capa = abrir(`
    <div class="hoja-top"><h2>Reportes</h2><button class="cerrar">×</button></div>
    <div class="campo"><label>Ventas mes a mes</label>
      ${ventas.length
        ? meses.map(m=>`<div class="barra${m.n===pico && pico>0 ? ' pico':''}">
             <span>${m.etiqueta}</span><span style="flex:1"><i style="width:${Math.round(m.n/max*100)}%"></i></span>
             <span class="val">${m.n}</span></div>`).join('')
        : '<span class="pista">Aún no hay ventas registradas. En cuanto empiece, aquí verá sus meses fuertes.</span>'}
    </div>
    <div class="campo"><label>Descargar para Excel</label>
      <button class="btn btn-borde" id="r-inv" style="width:100%">Inventario completo</button>
      <button class="btn btn-borde" id="r-ven" style="width:100%;margin-top:7px">Historial de ventas</button>
      <span class="pista">Se abren directo en Excel con doble clic.</span></div>
    <div class="campo"><label>Reporte en PDF</label>
      <button class="btn btn-primario" id="r-pdf" style="width:100%">Generar reporte</button>
      <span class="pista">Elija <b>Guardar como PDF</b> en el destino de impresión.</span></div>`);

  const h = capa.querySelector('.hoja');
  h.querySelector('#r-inv').addEventListener('click', ()=>{
    if (!moldes.length){ brindis('Todavía no hay moldes.'); return; }
    csvInventario(); brindis('Inventario descargado.');
  });
  h.querySelector('#r-ven').addEventListener('click', csvVentas);
  h.querySelector('#r-pdf').addEventListener('click', imprimirReporte);
}

/* ══════════ menú ══════════ */
function abrirMenu(){
  const enBodega = piezas.filter(p=>estado(p)==='listo').reduce((s,p)=>s+(Number(p.existencia)||0),0);
  const bajas = piezas.filter(p=>estado(p)==='listo' && Number(p.existencia) <= umbral(p));
  const pendientes = piezas.filter(sinNombre).length;
  const huecos = moldes.reduce((s,m)=>s+faltan(m), 0);

  const capa = abrir(`
    <div class="hoja-top"><h2>El taller hoy</h2><button class="cerrar">×</button></div>

    <div class="tarjetas">
      <div class="tarjeta"><b>${moldes.length}</b><span>Moldes</span></div>
      <div class="tarjeta"><b>${piezas.length}</b><span>Piezas distintas</span></div>
      <div class="tarjeta"><b>${enBodega}</b><span>Piezas en bodega</span></div>
      <div class="tarjeta"><b>${pendientes + huecos}</b><span>Por completar</span></div>
    </div>

    ${(pendientes + huecos) ? `<div class="aviso">
      Hay <b>${pendientes}</b> piezas sin nombre y <b>${huecos}</b> por registrar.
      Use el filtro <b>Sin nombre</b> para irlas completando.</div>` : ''}

    ${bajas.length ? `<div class="aviso" style="border-left-color:var(--alerta)">
      <b>Toca reponer:</b> ${bajas.slice(0,8).map(p=>`${esc(p.nombre)} (${p.existencia})`).join(' · ')}</div>` : ''}

    <div class="campo"><label>Vender</label>
      <button class="btn btn-verde" id="m-venta" style="width:100%">Registrar una venta</button></div>

    <div class="campo"><label>Precios</label>
      <button class="btn btn-borde" id="m-prod" style="width:100%">Productos y precios</button></div>

    <div class="campo"><label>Reportes</label>
      <button class="btn btn-borde" id="m-rep" style="width:100%">Ventas por mes, Excel y PDF</button></div>

    <div class="campo" style="margin-top:18px"><label>Conexión con Google Sheets</label>
      <input id="cfg-url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(config.url||'')}">
      <span class="pista">Dirección de la aplicación web de Apps Script.</span></div>
    <div class="campo">
      <input id="cfg-clave" placeholder="Clave secreta" value="${esc(config.clave||'')}">
      <span class="pista">La misma que puso en la variable CLAVE del script.</span></div>
    <div class="acciones" style="margin-top:6px">
      <button class="btn btn-primario" id="cfg-ok">Guardar conexión</button>
      <button class="btn btn-borde" id="cfg-sync">Sincronizar</button>
    </div>

    <div class="campo" style="margin-top:22px"><label>Respaldo</label>
      <button class="btn btn-borde" id="exportar" style="width:100%">Descargar respaldo</button>
      <span class="pista">Guárdelo en su correo una vez al mes.</span></div>`);

  const h = capa.querySelector('.hoja');
  h.querySelector('#m-venta').addEventListener('click', abrirVenta);
  h.querySelector('#m-prod').addEventListener('click', abrirProductos);
  h.querySelector('#m-rep').addEventListener('click', abrirReportes);

  h.querySelector('#cfg-ok').addEventListener('click', async ()=>{
    config.url = h.querySelector('#cfg-url').value.trim();
    config.clave = h.querySelector('#cfg-clave').value.trim();
    await cache.set('config', config);
    brindis('Conexión guardada.');
    sincronizar();
  });
  h.querySelector('#cfg-sync').addEventListener('click', ()=>{ cerrar(); sincronizar(); });

  h.querySelector('#exportar').addEventListener('click', ()=>{
    const datos = JSON.stringify({moldes, piezas, productos, ventas, fecha:new Date().toISOString()}, null, 2);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([datos], {type:'application/json'}));
    a.download = `filemon-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    brindis('Respaldo descargado.');
  });
}

/* ══════════ eventos ══════════ */
const q = $('#q');
q.addEventListener('input', ()=>{
  consulta = q.value;
  $('#limpiar').style.display = consulta ? 'block' : 'none';
  pintar();
});
$('#limpiar').addEventListener('click', ()=>{ q.value=''; consulta=''; $('#limpiar').style.display='none'; pintar(); q.focus(); });
$('#chips').addEventListener('click', ev=>{
  const b = ev.target.closest('.chip'); if (!b) return;
  filtro = b.dataset.f;
  $('#chips').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', String(c===b)));
  pintar();
});
$('#lista').addEventListener('click', ev=>{
  const z = ev.target.closest('[data-zoom]');
  if (!z) return;
  ev.stopPropagation(); ev.preventDefault();
  abrirVisor(z.dataset.zoom);
}, true);

$('#nuevo').addEventListener('click', ()=>abrirMolde(null));
$('#menu').addEventListener('click', abrirMenu);
$('#btnSync').addEventListener('click', ()=>{ config.url ? sincronizar() : abrirMenu(); });
document.addEventListener('keydown', ev=>{ if (ev.key==='Escape') cerrar(); });
window.addEventListener('online', ()=>sincronizar(true));

iniciar();
})();
</script>
